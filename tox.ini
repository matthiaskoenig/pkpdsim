[tox]
envlist = ty, py3.{14,15}

[testenv]
# the versions of uv.lock: the environment is created by `uv sync --locked`
# (pytest, its plugins and ty are in the dev extra, so in the lock), not by an
# installation from pyproject.toml, which would take the newest release allowed
# by a floor
runner = uv-venv-lock-runner
extras = dev
package = wheel
wheel_build_env = .pkg
# what follows `--` is passed to pytest, e.g. `tox r -e py3.14 -- --durations=15`
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check
