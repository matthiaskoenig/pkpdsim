[tox]
envlist = ty, py3.{14,15}

[testenv]
# the versions of uv.lock: the environment is created by `uv sync --locked`
# (pytest, its plugins and ty are in the dev extra, so in the lock), not by an
# installation from pyproject.toml, which would take the newest release allowed
# by a floor
runner = uv-venv-lock-runner
extras = dev
package = wheel
wheel_build_env = .pkg
# the interpreters of uv, never one of the system: the wheel of libroadrunner
# 2.11.0 for python 3.15 takes `__jit_debug_register_code` from `libpython`,
# which only an interpreter built with the experimental JIT defines (those of
# uv do, e.g. deadsnakes does not: `undefined symbol: __jit_debug_register_code`
# at `import roadrunner`); the inline plugin `toxfile.py` puts the `libpython`
# of the interpreter on `LD_LIBRARY_PATH`
uv_python_preference = only-managed
# what follows `--` is passed to pytest, e.g. `tox r -e py3.14 -- --durations=15`;
# the load time of a PBPK model is measured in a serial run of its own, since
# CPU time inflates among the parallel workers (the test skips itself there)
# it runs also when {posargs} selects other tests: CI passes `--durations=15`,
# so it is not skipped for given arguments (see docs/development.md)
commands =
    pytest {posargs}
    pytest -n 0 tests/pbpk/test_builder.py::test_load_time

[testenv:ty]
# the oldest supported python; without it the environment takes the python
# which runs tox, e.g. 3.13 of `uvx`, outside of `requires-python`
base_python = py3.14
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check
