[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkpdsim"
dynamic = ["version"]
description = "pkpdsim provides the building blocks shared by physiologically based pharmacokinetic and pharmacodynamic (PBPK/PD) models in SBML."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "pharmacokinetics",
    "pharmacodynamics",
    "PBPK",
    "SBML",
    "modeling",
    "simulation",
]
dependencies = [
    # the factory, the metadata and the console of the models
    "sbmlutils>=0.17.1",
    # the PBPKO terms of the annotations of a library model (`pkpdsim.pbpk.annotation`)
    "pymetadata>=0.8.0",
    # the simulator, the initial values are selections of a roadrunner model; a
    # build with the physiology over age (`PBPKDefinition.age`) needs the cache
    # of the initial value resolvers (sys-bio/roadrunner#1435), which 2.11.0
    # lacks: raise the floor when a release carries it and the tests marked
    # `over_age` stop skipping (tests/pbpk/conftest.py)
    "libroadrunner>=2.11.0",
    # the simulation experiments, their figures and reports, and the fits
    # 0.17 and 0.18 take over the generic modules of pkpdsim (the consolidation),
    # until 0.18 is released pkpdsim follows the develop branch, see
    # `[tool.uv.sources]`
    "sbmlsim>=0.18.0,<0.19",
    # the non-compartmental analysis of the scans of a model (`pkpdsim.pk`)
    "pkpdutils>=1.4.0",
    # the study folders of format 2 of PK-DB, read as `pkdb check` reads them (`pkpdsim.data`)
    "pkdb>=0.12.19",
    # imported directly, also the dependencies of the packages above
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    # the root search of a regional absorption profile (`pkpdsim.pbpk.regional`)
    "scipy>=1.18.1",
    # the blocks of the credibility report (`pkpdsim.credibility.blocks`)
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    # the raster of the bodies of the figures (`pkpdsim.pbpk.visual`), also the images
    # of matplotlib; 13.0.0 fixes the advisories of 12.3.0, among them the critical
    # GHSA-5x8w-8jj5-q52h
    "pillow>=13.0.0",
    # the outlines of the layers of a body traced on its raster (`pkpdsim.pbpk.visual.body`)
    "contourpy>=1.4.0",
    "python-libsbml>=5.21.2",
    # not imported: the CA bundle of requests, through which sbmlutils and pymetadata
    # reach the network; 2026.10.19 removes the emSign roots (GHSA-6q48-6c7w-9gw2)
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# the second simulator of the battery of the credibility, the engine AMICI of
# sbmlsim (`sbmlsim.credibility.battery`), built from source
amici = [
    "sbmlsim[amici]",
]
dev = [
    "bump-my-version>=1.5.1",
    "ruff>=0.17.3",
    "pre-commit>=4.6.2",
    "ty>=0.0.95",
    # 4.67.5 refuses its package staging directory when it was created under
    # umask 002, tox-dev/tox#4357
    "tox>=4.65.0,!=4.67.5",
    "tox-uv>=1.35.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "zensical>=0.0.69",
    "mkdocstrings-python>=2.0.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
pkpdsim-verify = "pkpdsim.verify:main"
# the commands of the models, which take the model package first
run_simulation = "pkpdsim.cli:run_simulation_main"
run_fit = "pkpdsim.cli:run_fit_main"
run_report = "pkpdsim.cli:run_report_main"
run_identifiability = "pkpdsim.cli:run_identifiability_main"
run_credibility = "pkpdsim.cli:run_credibility_main"
# the release of a model repository
pkpd_release = "pkpdsim.release.cli:main"

[project.urls]
Homepage = "https://matthiaskoenig.github.io/pkpdsim"
Documentation = "https://matthiaskoenig.github.io/pkpdsim"
Repository = "https://github.com/matthiaskoenig/pkpdsim"
Issues = "https://github.com/matthiaskoenig/pkpdsim/issues"
Changelog = "https://github.com/matthiaskoenig/pkpdsim/tree/develop/release-notes"
Download = "https://pypi.org/project/pkpdsim"

[tool.hatch.version]
path = "./src/pkpdsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pkpdsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist), `pytest -n 0` runs them in one process
addopts = "-n auto"
markers = [
    "slow: slow tests, deselect with -m \"not slow\"",
    "uncached_build: a test whose PBPK builds validate and flatten, without the cache of the flat models",
]

[tool.ty.environment]
# the package lives in the src layout, the scripts are a package at the root of
# the repository, the toy model of the tests is a package in `tests`; the
# checked python version is inferred from `project.requires-python` (i.e. the
# oldest supported version)
root = ["./src", ".", "./tests"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
