[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkpdsim"
dynamic = ["version"]
description = "A library for physiologically based pharmacokinetic and pharmacodynamic (PBPK/PD) models in SBML."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "pharmacokinetics",
    "pharmacodynamics",
    "PBPK",
    "SBML",
    "modeling",
    "simulation",
]
dependencies = [
    # the factory, the metadata and the console of the models (0.17.3 carries
    # the wide math of sbmlode 0.3.3, which `sbmlutils.converters.ode`
    # re-exports module for module, see the floor of sbmlsim below; 0.18.0
    # drops the integrations which are not about SBML, none of which pkpdsim
    # uses, and prints its output on a rich console)
    "sbmlutils>=0.18.0",
    # the PBPKO terms of the annotations of a library model (`pkpdsim.pbpk.annotation`);
    # its `pymetadata.omex` also writes the COMBINE archive of a model, which
    # pkpdsim reaches through `sbmlsim.release.archive`. 0.9.0 reads and writes
    # an archive through the Rust `pymetadata-core` and is therefore no longer
    # pure python: a platform without an abi3 wheel of the core needs a Rust
    # toolchain, see the installation page and the release notes of 0.36.0
    "pymetadata>=0.9.0",
    # the simulator, the initial values are selections of a roadrunner model.
    # sbmlsim simulates with a build of the branch `develop` of libroadrunner,
    # which is not on PyPI, so every install names the index of its wheels, see
    # `[tool.uv.sources]` and the installation page. The build carries the cache
    # of the initial value resolvers (sys-bio/roadrunner#1435), which 2.11.0
    # lacks, so a build with the physiology over age (`PBPKDefinition.age`)
    # compiles in seconds instead of minutes and the tests which build one run
    # on every platform. The floor is the one of sbmlsim 0.36.0, which compares
    # the installed libroadrunner with its own requirement at `import sbmlsim`
    # and raises an `ImportError` for an older build, so a lower floor here
    # would let an install resolve to a libroadrunner sbmlsim refuses
    # (`dev714` carries the fixes of the rounding of the event times of
    # roadrunner #1430 and #1460, matthiaskoenig/sbmlsim#598)
    "libroadrunner>=2.12.0.dev714",
    # the simulation experiments, their figures and reports, and the fits
    # (0.17 and 0.18 took over the generic modules of pkpdsim, the consolidation;
    # 0.24.0 has the interactive panels a factory annotates its models with;
    # 0.32.0 has the figure of an app, the panels of a readouts sidecar
    # (`sbmlsim.panel_figure`) and `.json` among the formats of a COMBINE
    # archive, so the sidecar of a body figure is an entry of the archive;
    # 0.35.0 has `sbmlsim.domains`, the reader of the domain contract which
    # `pkpdsim.sbml.domains` writes and re-exports instead of reading it a
    # second time (#245), with the value set of an interval clip; 0.36.0
    # estimates the Sobol, FAST and Morris indices of every element of an
    # output at once, so a sampling analysis of a library model of many
    # readouts costs a fraction of one call of SALib per element, and adds the
    # polynomial chaos and the local sensitivities the engine core integrates;
    # 0.37.0 makes the engine core the default engine of every simulator and
    # 0.38.0 moves the objective of a parameter fit into it, so the residuals
    # of a fit are integrated by the CVODE of the engine and the fitted numbers
    # of a model package can move in their last digits; 0.38.1 raises its own
    # floors of sbmlode and sbmlutils onto the releases which read and write
    # the wide math of a model, so the COMBINE archive of a model package
    # whose assignment rule sums a thousand parameters is written through
    # `sbmlsim.release.archive` instead of failing with a `RecursionError`,
    # and 0.38.2 raises the floor of `sbmlsim-core` onto 0.24.1, where a
    # profile of the engine which steps onto a bound of its parameter ends at
    # that bound instead of failing the whole identifiability analysis with a
    # value an ulp outside the bounds; 0.39.0 adds the `ChaosAnalysis` of the
    # sensitivity runner, which the runners of pkpdsim take as a fifth
    # analysis, and makes the factor `integrator` of the credibility
    # verification a check of its own again on the engine, on the floor
    # `sbmlsim-core>=0.25.0`, whose integrator takes the order of its method
    # and the bounds of its error test from the request); 0.40.0 simulates the
    # groups of fit mappings of one evaluation of the objective as one batch of
    # the engine, so a single evaluation - a profile point, a polishing step,
    # the evaluation of a report - uses the CPUs of the machine instead of the
    # thread of its caller, and reads a change whose value is a formula over a
    # concentration as a form of the request instead of folding it into the
    # number of the point it was built at; 0.41.0 walks a profile at the scale
    # of its parameter and corrects its step by the curvature, on the floor
    # `sbmlsim-core>=0.26.0`, which takes the first steps of a request; 0.42.0 draws
    # every figure with the renderer of `sbmlsim-core>=0.29.0` (svg, png, json) and
    # imports no matplotlib; 0.42.1 takes every colour name of matplotlib (`tab:grey`);
    # 0.43.0 places a legend inside where matplotlib would (`legend_loc`) and draws
    # the axis lines, caps, aspects, edges and colour maps of `sbmlsim-core>=0.30.0`;
    # 0.44.0 the colour bars, ticks, markers, legends and texts of sbmlsim-core 0.31.1
    # 0.45.0 `display.relocated`, which names the folders of a staged run, 0.46.0 the
    # reductions and PK parameters of a fit in the engine and 0.47.0 the chart builder of
    # the renderer of sbmlsim-core 0.33.0; 0.48.0 fits a scan group in the engine,
    # starts the pool of a run before its experiments and reads an SBML once; 0.49.0
    # takes the chart builder from sbmlsim-core 0.34.0, 0.50.0 the curves of a scan
    # between its points, the forkserver hook `preload_in_forkserver` and pkpdutils 2.0.0;
    # 0.52.0 the sensitivity analysis in sbmlsim-core (no SALib) and the PEtab export
    "sbmlsim>=0.52.0",
    # imported directly: the scripts and tests of the browser examples and, at runtime,
    # `pkpdsim.zonation.figures` (`color_scale`, `figure_geometry`); 0.29.1 no longer
    # reports a stall at a step which leaves the time unchanged; 0.30.0 keeps a legend
    # inside where matplotlib would and draws the axes darker; 0.31.1 draws colour bars
    # of stops, fixed ticks, the markers of matplotlib and legend columns; 0.32.0 reads
    # the reductions of a curve of a fit; 0.33.0 is the renderer of sbmlsim 0.47.0;
    # 0.34.0 carries the chart builder (`sbmlsim_core.chart`), 0.35.0 thins in rust,
    # 0.37.0 the sensitivity analysis, compact markers and caps of matplotlib's capsize
    "sbmlsim-core>=0.37.0",
    # the non-compartmental analysis of the scans of a model (`pkpdsim.pk`); 2.0.0
    # draws its figures with sbmlsim-core and no longer pulls in matplotlib; 2.0.1 the
    # error caps of matplotlib's capsize
    "pkpdutils>=2.0.1",
    # the study folders of format 2 of PK-DB, read as `pkdb check` reads them (`pkpdsim.data`)
    # 0.12.20 draws `pkdb plot` with sbmlsim-core and no longer pulls in matplotlib
    "pkdb>=0.12.20",
    # imported directly, also the dependencies of the packages above
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    # the root search of a regional absorption profile (`pkpdsim.pbpk.regional`)
    "scipy>=1.18.1",
    # the blocks of the credibility report (`pkpdsim.credibility.blocks`)
    "jinja2>=3.1.6",
    # the raster of the bodies of the figures (`pkpdsim.pbpk.visual`); 13.0.0 fixes
    # the advisories of 12.3.0, among them the critical GHSA-5x8w-8jj5-q52h
    "pillow>=13.0.0",
    # the outlines of the layers of a body traced on its raster (`pkpdsim.pbpk.visual.body`)
    "contourpy>=1.4.0",
    "python-libsbml>=5.21.2",
    # the live table of the steps of a pipeline (`pkpdsim.pipeline`) and the
    # console of `pkpdsim-verify`
    "rich>=15.0.0",
    # not imported: the CA bundle of requests, through which sbmlutils and pymetadata
    # reach the network; 2026.10.19 removes the emSign roots (GHSA-6q48-6c7w-9gw2)
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# the PDF of the publication figure of a model (`pkpdsim.pbpk.visual.publication`),
# cairosvg needs the cairo library of the system
pdf = [
    "cairosvg>=2.8.2",
]
# the second simulator of the battery of the credibility, the engine AMICI of
# sbmlsim (`sbmlsim.credibility.battery`), built from source
amici = [
    "sbmlsim[amici]",
]
dev = [
    "bump-my-version>=1.5.1",
    "ruff>=0.17.3",
    "pre-commit>=4.6.2",
    "ty>=0.0.95",
    # 4.67.5 refuses its package staging directory when it was created under
    # umask 002, tox-dev/tox#4357
    "tox>=4.65.0,!=4.67.5",
    "tox-uv>=1.35.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "zensical>=0.0.69",
    "mkdocstrings-python>=2.0.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
pkpdsim-verify = "pkpdsim.verify:main"
# the commands of the models, which take the model package first
run_simulation = "pkpdsim.cli:run_simulation_main"
run_fit = "pkpdsim.cli:run_fit_main"
run_report = "pkpdsim.cli:run_report_main"
run_identifiability = "pkpdsim.cli:run_identifiability_main"
run_credibility = "pkpdsim.cli:run_credibility_main"
run_sensitivity = "pkpdsim.cli:run_sensitivity_main"
run_petab = "pkpdsim.cli:run_petab_main"
run_pipeline = "pkpdsim.cli:run_pipeline_main"
# the release of a model repository
pkpd_release = "pkpdsim.release.cli:main"

[project.urls]
Homepage = "https://matthiaskoenig.github.io/pkpdsim"
Documentation = "https://matthiaskoenig.github.io/pkpdsim"
Repository = "https://github.com/matthiaskoenig/pkpdsim"
Issues = "https://github.com/matthiaskoenig/pkpdsim/issues"
Changelog = "https://github.com/matthiaskoenig/pkpdsim/tree/develop/release-notes"
Download = "https://pypi.org/project/pkpdsim"

[tool.hatch.version]
path = "./src/pkpdsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pkpdsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist), `pytest -n 0` runs them in one process
addopts = "-n auto"
markers = [
    "slow: slow tests, deselect with -m \"not slow\"",
    "uncached_build: a test whose PBPK builds validate and flatten, without the cache of the flat models",
]

[tool.uv.sources]
# the development environment, its lock, the continuous integration and tox run
# on the builds of the branch `develop` of libroadrunner, which sbmlsim requires
# (`libroadrunner>=2.12.0.dev714`) and which are not on PyPI: a package index of
# their wheels (matthiaskoenig/roadrunner-wheels, versions `<version>.dev<run>`).
# A single table and not a list of sources, which tox-uv cannot read. The source
# is not part of the built package, which carries the requirement above, so an
# install of pkpdsim names the index as well (docs/installation.md).
# `uv lock --upgrade-package libroadrunner` moves the lock to the latest build
libroadrunner = { index = "roadrunner-dev" }

[[tool.uv.index]]
name = "roadrunner-dev"
url = "https://matthiaskoenig.github.io/roadrunner-wheels/simple/"
explicit = true

[tool.ty.environment]
# the package lives in the src layout, the scripts are a package at the root of
# the repository, the toy model of the tests is a package in `tests`; the
# checked python version is inferred from `project.requires-python` (i.e. the
# oldest supported version)
root = ["./src", ".", "./tests"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.analysis]
# cairosvg, the PDF of the publication figure, is the optional extra `pdf` and not
# in the environment of the check
allowed-unresolved-imports = ["cairosvg"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
