<script>
const CARDS = {"bile": ["<b>bile</b>", "secreted by the hepatocytes of every zone", "observers <code>bile</code> (\u00b5l) and <code>bile_rate</code> (\u00b5l/min)"], "gas": ["<b>sweep gas</b> of the oxygenator", "O2 into the perfusate, towards 50 kPa", "CO2 out of the perfusate, towards 5.223 kPa"], "inflow": ["<b>inflow tubing with the oxygenator</b> <code>V_in</code>", "volume 10 ml, residence time 3.333 min", "O2 towards pO2 50 kPa (<code>pO2_target</code>), <code>k_oxy</code> 2 1/min", "CO2 towards pCO2 5.223 kPa of the fresh perfusate (<code>pCO2_gas</code>), <code>k_oxy_co2</code> 2 1/min"], "li": ["<b>liver li</b> <code>M_li</code>", "mass 7.229 g, density 1 kg/l, volume 7.229 ml", "vascular space 21 % (1.518 ml), cells 69 % (4.988 ml)", "4 zones in series from periportal to pericentral, each 1/4 of the volumes", "the core in the cells of every zone: glucose import, oxygen import, lactate export with a proton, glycogenolysis, glycolysis, lactate dehydrogenase, ATP use, TCA cycle, oxidative phosphorylation, pentose phosphate pathway, ROS production, ROS detoxification, glutathione reductase", "released by necrosis: ALT, AST, LDH, potassium", "secretes bile"], "medium": ["<b>medium change</b>", "an experiment replaces a fraction of the reservoir with fresh perfusate between the parts of a simulation"], "outflow": ["<b>outflow tubing</b> <code>V_out</code>", "volume 10 ml"], "pump": ["<b>pump</b> <code>Q_pump</code>", "flow 3 ml/min, 0.415 ml/min/g of the organ", "the total flow of the circuit; an experiment sets the flow of its group"], "reservoir": ["<b>reservoir</b> <code>V_res</code>", "volume 1000 ml", "the perfusate: glc, o2, lac, co2, hco3, h, k, alt, ast, ldh", "a medium change of an experiment replaces a fraction of it with fresh perfusate"], "sub:alt": ["<b>alt</b> ALT", "none fresh, released by necrosis", "at every site <code>alt_&lt;site&gt;</code>"], "sub:ast": ["<b>ast</b> AST", "none fresh, released by necrosis", "at every site <code>ast_&lt;site&gt;</code>"], "sub:co2": ["<b>co2</b> CO2", "fresh at the buffer equilibrium, pCO2 5.223 kPa", "at every site <code>co2_&lt;site&gt;</code>"], "sub:glc": ["<b>glc</b> glucose", "fresh 6.5 mM", "at every site <code>glc_&lt;site&gt;</code>"], "sub:h": ["<b>h</b> protons", "fresh at pH 7.4", "at every site <code>h_&lt;site&gt;</code>"], "sub:hco3": ["<b>hco3</b> bicarbonate", "fresh 24 mM", "at every site <code>hco3_&lt;site&gt;</code>"], "sub:k": ["<b>k</b> potassium", "fresh 4.5 mM, released by necrosis", "at every site <code>k_&lt;site&gt;</code>"], "sub:lac": ["<b>lac</b> lactate", "fresh 1 mM", "at every site <code>lac_&lt;site&gt;</code>"], "sub:ldh": ["<b>ldh</b> LDH", "none fresh, released by necrosis", "at every site <code>ldh_&lt;site&gt;</code>"], "sub:o2": ["<b>o2</b> oxygen", "fresh at pO2 50 kPa", "at every site <code>o2_&lt;site&gt;</code>"], "temperature": ["<b>temperature</b> <code>T</code> 37 \u00b0C", "the rates of the core scale with the Arrhenius factor <code>f_T</code>, 1 at 37 \u00b0C", "the solubility of oxygen rises in the cold"], "zone:z1": ["<b>zone z1</b> of 4, periportal", "vascular space <code>Vvas_z1</code> 0.3795 ml, cells <code>Vcell_z1</code> 1.247 ml", "uniform: no zonal profile"], "zone:z2": ["<b>zone z2</b> of 4, between periportal and pericentral", "vascular space <code>Vvas_z2</code> 0.3795 ml, cells <code>Vcell_z2</code> 1.247 ml", "uniform: no zonal profile"], "zone:z3": ["<b>zone z3</b> of 4, between periportal and pericentral", "vascular space <code>Vvas_z3</code> 0.3795 ml, cells <code>Vcell_z3</code> 1.247 ml", "uniform: no zonal profile"], "zone:z4": ["<b>zone z4</b> of 4, pericentral", "vascular space <code>Vvas_z4</code> 0.3795 ml, cells <code>Vcell_z4</code> 1.247 ml", "uniform: no zonal profile"]};
const card = document.getElementById('card');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
document.querySelectorAll('.wrap [data-k]').forEach(el => {
  el.addEventListener('mousemove', ev => {
    const k = el.dataset.k;
    const rows = k.startsWith('txt:') ? [esc(k.slice(4))] : CARDS[k];
    if (!rows) return;
    ev.stopPropagation();
    card.innerHTML = rows.map(r => `<div>${r}</div>`).join('');

  });

});
