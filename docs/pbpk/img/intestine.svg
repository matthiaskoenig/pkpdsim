<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" role="img" aria-labelledby="pk-gut-title pk-gut-desc">
<title id="pk-gut-title">The segmented intestine</title>
<desc id="pk-gut-desc">An oral dose enters the stomach. The lumen segments stomach, duodenum, upper and lower jejunum, upper and lower ileum, caecum, colon ascendens, transversum, descendens, sigmoid and rectum pass the drug on by transit into the feces. Every segment but the stomach absorbs into its mucosa, which drains into the portal vein; the colon absorbs little. The bile drains into the duodenum.</desc>
<style>
.pk-t{fill:currentColor;font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:14px}
.pk-s{font-size:12.5px}
.pk-b{font-weight:600}
.pk-dim{fill-opacity:.72}
.pk-line{stroke:currentColor;stroke-opacity:.6;stroke-width:1.5;fill:none}
.pk-faint{stroke:currentColor;stroke-opacity:.3;stroke-width:1.5;fill:none}
.pk-lumen{fill:rgba(255,150,40,.14);stroke:rgba(230,130,30,.8);stroke-width:1.2}
.pk-mu{fill:rgba(60,170,100,.14);stroke:rgba(60,170,100,.85);stroke-width:1.2}
.pk-mu2{fill:rgba(60,170,100,.06);stroke:rgba(60,170,100,.5);stroke-width:1.2}
.pk-por{fill:rgba(150,80,200,.14);stroke:rgba(150,80,200,.85);stroke-width:1.2}
.pk-sink{fill:rgba(128,128,128,.12);stroke:currentColor;stroke-opacity:.45;stroke-width:1.2}
</style>
