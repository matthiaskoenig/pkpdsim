.pk-s{font-size:12.5px}
.pk-b{font-weight:600}
.pk-dim{fill-opacity:.72}
.pk-line{stroke:currentColor;stroke-opacity:.6;stroke-width:1.5;fill:none}
.pk-org{fill:rgba(128,128,128,.1);stroke:currentColor;stroke-opacity:.45;stroke-width:1.2}
.pk-art{fill:rgba(225,60,60,.14);stroke:rgba(225,60,60,.85);stroke-width:1.2}
.pk-ven{fill:rgba(70,110,230,.14);stroke:rgba(70,110,230,.85);stroke-width:1.2}
.pk-por{fill:rgba(150,80,200,.14);stroke:rgba(150,80,200,.85);stroke-width:1.2}
</style>
