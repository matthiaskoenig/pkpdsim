<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 566" role="img" aria-labelledby="pk-circ-title pk-circ-desc">
<title id="pk-circ-title">Topology of the circulation</title>
<desc id="pk-circ-desc">The venous blood flows through the lung into the arterial blood. The arterial blood supplies heart, brain, muscle, skin, adipose, bone, gonads and kidney, which drain into the venous blood, and the hepatic artery of the liver. Stomach, small and large intestine, spleen and pancreas drain into the portal vein, which feeds the liver; the liver drains into the venous blood.</desc>
