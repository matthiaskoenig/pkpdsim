<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" role="img" aria-labelledby="pko-organ-title pko-organ-desc">
<title id="pko-organ-title">The standard organ and its collapsing</title>
<desc id="pko-organ-desc">The standard organ has plasma, blood cells, interstitial and intracellular space. The organ takes the arterial plasma and returns its outflow to the venous pool; plasma exchanges with the interstitium across the endothelium, the interstitium with the cells passively and by basolateral transport, the cells with bile, urine or lumen by apical transport. Only the parts a substance needs are built: the full form with interstitial and intracellular space, the merged tissue, or one species for the flow-limited organ.</desc>
<style>
.pko-t{fill:currentColor;font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:14px}
.pko-s{font-size:12.5px}
.pko-b{font-weight:600}
.pko-dim{fill-opacity:.72}
.pko-line{stroke:currentColor;stroke-opacity:.6;stroke-width:1.5;fill:none}
.pko-band{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:1}
.pko-art{fill:rgba(225,60,60,.14);stroke:rgba(225,60,60,.85);stroke-width:1.2}
.pko-bc{fill:rgba(225,60,60,.07);stroke:rgba(225,60,60,.6);stroke-width:1.2;stroke-dasharray:4 3}
.pko-is{fill:rgba(60,170,170,.14);stroke:rgba(40,150,150,.85);stroke-width:1.2}
.pko-ic{fill:rgba(70,140,255,.14);stroke:rgba(70,140,255,.8);stroke-width:1.2}
.pko-ti{fill:rgba(60,170,100,.14);stroke:rgba(60,170,100,.85);stroke-width:1.2}
.pko-sink{fill:rgba(150,80,200,.12);stroke:rgba(150,80,200,.8);stroke-width:1.2}
</style>
