name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # the tests of pkpdsim.pbpk build and compile about 500 models; every
    # platform runs them in four shares (`--shard`), about 8 minutes on the
    # hosted ubuntu runner and 15 on windows instead of 30 and 55 in one job
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests python 3.14 on every platform, python
        # 3.15 is tested locally with `tox run-parallel`, see docs/development.md
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv and python
      uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
    - name: Test with tox
      # the slowest tests are listed in the log, so that they stay visible
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- --durations=15 --shard ${{ matrix.shard }}/4

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not, see .github/rulesets/
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/pkpdsim
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        python-version: "3.14"
        # a release is built from a clean state, never from a restored cache
        enable-cache: false
    - name: Build package
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
