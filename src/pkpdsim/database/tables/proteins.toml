# The enzymes and transporters of the PBPK models (human).
# `uniprot` is the reviewed human UniProtKB accession (UniProt, checked against rest.uniprot.org
# 2026-10-25, ABCC3, ABCC4 and SLC6A8 2026-10-27, CES1, CYP2E1, UGT2B15 and UGT1A3 2026-11-02, CYP3A5 2026-11-04); `ncit` the NCI Thesaurus concept of the protein
# (checked against the NCIt EVS API 2026-10-25, ABCC3, ABCC4 and SLC6A8 2026-10-27, CES1, CYP2E1, UGT2B15 and UGT1A3 2026-11-02, CYP3A5 2026-11-04), left out where NCIt has no concept for the protein (SLC22A6, SLC22A8, UGT1A3).
#
# The table holds no abundances: the capacity of a process is a rate of the
# model, and the ratio of two enzymes of one pathway is a `RateOf` of the first
# (see docs/pbpk/chemistry.md). The only expression data of the library are the
# relative amounts of CYP3A4 along the intestinal mucosa
# (`data/intestine_human.toml`); a process of any other protein is placed by
# mucosa volume over the small intestine.

source = "UniProt"

