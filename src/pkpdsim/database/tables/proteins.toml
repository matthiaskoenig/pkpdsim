# The second CYP3A of liver and small intestine. No open source read gives its
# abundance along the intestinal segments, so a process of CYP3A5 is placed by
# mucosa volume over the small intestine, as every protein but CYP3A4. What the
# open sources give, for the capacity a model has to choose: in the mucosa of
# the small intestine of 11 of 31 donors CYP3A5 was 4.9 to 25 (mean 16) pmol/mg
# microsomal protein, against 8.8 to 150 pmol/mg of CYP3A4 and a mean total
# CYP3A of 50 pmol/mg (Paine 2006, doi:10.1124/dmd.105.008672, PMID 16467132,
# free full text PMC2222892); in the livers and jejuna of donors with a
# CYP3A5*1 allele CYP3A5 was more than half of the total CYP3A (Lin 2002,
# doi:10.1124/mol.62.1.162, PMID 12065767, abstract read). These abundances are
# those of expressors: CYP3A5*3 and *6 abolish the protein, and CYP3A5 is
# expressed in 60 % of African American and 33 % of Caucasian livers (Kuehl
# 2001, doi:10.1038/86882, PMID 11279519, abstract read), so the reference
# genotype belongs to the model, not to the library: `f_CYP3A5` is 1 as for
# every protein, and a model whose reference subjects do not express it (*3/*3)
# writes the genotype into the rate of its definition and keeps `f_CYP3A5` for
# the interactions. No factor of impairment: the transcribed figure of El
# Khateeb 2021 in `data/impairment.toml` gives CYP3A4 and not CYP3A5, and
# Yoshida 2016 does not separate the CYP3A4/5 model drugs, so CYP3A5 has none,
# as UGT1A3 has none.
[proteins.CYP3A5]
name = "Cytochrome P450 3A5"
uniprot = "P20815"
ncit = "C45999"

