# The intestine of the adult male mouse, in the segments
# of intestine_human.toml. Segment geometry (radii, lengths), fill levels,
# surface enhancement factors and the fasted pH are those of the PK-Sim
# database (develop aaebb648; no value origin is stored for them, the rat
# lengths cite Willmann 2003). The lumen volume of a segment is its frustum
# times the fractional steady state fill level of the database; the transit
# time of a region (literature) is split onto its segments by their volume
# shares (a uniform flow of the fluid). No values found: the fed gastric
# emptying, the intestinal Cyp3a of the mouse; see rodents.md.

[stomach]
volume = { value = 0.0002, unit = "l", source = "PKSimDB", notes = "derived: PK-Sim database stomach (radius 0.04 dm, length 0.06 dm, fractional steady state fill level 0.66314), pi*r^2*L*fill; McConnell 2008 (abstract): water content of the whole gastrointestinal tract of the fasted mouse 0.81 +- 1.3 ml, the stomach capacity about 0.4 ml" }
transit_time = { value = 20.0, unit = "min", source = "PKSimDB", notes = "gastric emptying time 20 min of the PK-Sim database mouse, fasted (no value origin)" }
# transit_time_fed: not found for the mouse (no fed gastric emptying time read)
ph = { value = 4.0, unit = "dimensionless", source = "McConnell2008", notes = "abstract: mouse stomach pH 4.0 fasted (3.0 fed); the PK-Sim database fasted basal pH 4.04" }
area_factor = { value = 0.0, unit = "dimensionless", source = "ModelChoice", notes = "no absorption in the stomach, as the human table" }

