# The intestine of the reference adult: the lumen segments of the segmented
# intestine, the mucosa, the single lumen and the bile.
#
# The segments follow the anatomical segmentation of Thelen 2011 (stomach,
# duodenum, upper and lower jejunum, upper and lower ileum, caecum, colon
# ascendens, transversum, descendens, sigmoid, rectum). A region of the
# literature (small intestine, colon) is split onto its segments:
#
# - the small intestinal transit time onto duodenum, jejunum and ileum by
#   their physiological lengths (Mudie 2010, Table 4: 21, 105 and 156 cm of
#   282 cm), jejunum and ileum into equal halves: a uniform velocity of the
#   transit (a choice, the velocity is higher proximally);
# - the colonic transit onto the segments by the segmental transits of
#   Metcalf 1987 (right colon: caecum and colon ascendens, left colon: colon
#   transversum and descendens, rectosigmoid: colon sigmoid and rectum, each
#   halved; a choice of the mapping);
# - the fluid volume of a region onto its segments in proportion to their
#   transit times (a uniform flow of the fluid through the region).
#
# Per segment: the fluid volume (l), the transit time (min, fasted; the
# stomach fed as well), the pH (data only, no process reads it yet), the
# absorption scaling `area_factor` (the mucosal surface per lumen volume
# relative to the small intestine, the factor on `ka_<s>`) and the relative
# expression of CYP3A4 in the mucosa (its microsomal content; a process of
# the protein is placed into the mucosa segments by expression times mucosa
# volume, the sum kept). The stomach has no mucosa and no absorption. Every
# other protein, also ABCB1 and ABCG2, is placed by mucosa volume until
# abundances along the intestine (Drozdzik 2014) are transcribed from the
# publication and verified.

