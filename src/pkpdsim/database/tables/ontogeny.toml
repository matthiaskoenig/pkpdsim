# The ontogeny of the enzymes and transporters: factors on the
# activity of a protein in an organ (`pkpdsim.pbpk.age`).
#
# `[ontogeny.<organ>.<protein>]`, the organ by its token (`li` liver, `ki`
# kidney, `si` small intestine): the abundance or activity per amount of
# tissue relative to the adult over age, in the forms of age_human.toml
# (`hill` of the postnatal age in years or the postmenstrual age in weeks);
# the physiology divides it by its value at 35 years. A protein of an organ
# without an entry has no ontogeny (1 at every age): no function was fitted
# (SULT1A1, ABCC3, SLC6A8), the protein is stable (SLCO1B1, ABCG2, ABCC2,
# ABCC4, MATE1 of the kidney: Prasad 2016, Cheung 2019), or no data were found.
# The abundance per mg of protein shows no consistent change of the adults
# (Parkinson 2004, Wolbold 2003, Prasad 2014): the elderly have no factor, the
# smaller liver of age_human.toml is their change; the microsomal protein per
# gram of liver (Barter 2008) is not applied, a model choice (PK-Sim applies
# the fractions to the tissue alike).
#
# The differences of the sexes are in sex_human.toml.

[ontogeny.li.CYP1A2]
form = "points"
age = [0.01, 0.02, 0.05, 0.1, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 12.0, 16.0, 20.0]
value = [0.048, 0.102, 0.242, 0.451, 0.837, 1.151, 1.394, 1.485, 1.516, 1.526, 1.467, 1.347, 1.204, 1.081, 1.0]
source = "Upreti2016"
sources = ["PKSimOntogeny"]
notes = "The in vivo ontogeny of CYP1A2 of the liver, Figure 1 panel A of Upreti 2016 (caffeine in apnoea of prematurity, their references 57-69): half of the adult activity at about 0.3 years, a peak of 1.53 times the adult at about 2 to 3 years and a fall back to the adult value in adolescence. Replaces the in vitro Hill of the PK-Sim database (Section A.1, A0.5 65.639 weeks of postmenstrual age, n 10.015, from the caffeine N3- and N7-demethylation of Cazeneuve 1994 and Sonnier and Cresteil 1998 and the protein of Ratanasavanh 1991), which reaches half of the adult at 0.49 years of postnatal age with a much steeper rise and never exceeds it. The function is the in vivo curve of Upreti 2016 Figure 1 digitized with `scripts/database/digitize_curve.py` and the configuration `scripts/database/upreti2016/figure1.json` from the image of page 5 of the PDF, read at the ages above and closed to 1 at 20 years, where the adult data of the panel sit; below 0.01 and above 20 years the first and the last value are held, and the library's `AGE` is the postnatal age of a birth at term, so a preterm neonate is outside it (the Hill function of the postmenstrual age which this entry replaced was not). The curve and not the equations of their Table 1: the printed parameters cannot be implemented as they stand, because the two pieces of the CYP3A row do not meet at the break point (equation 1 gives 1.675 at 2.5 years, equation 2 gives 1.519), the CYP1A2 row has C2 = C3 = 0, so its equation 2 is the constant 1.5 and never returns to the adult value, and the printed Age_50 of both rows puts the rise earlier than the plotted curve (CYP3A would be at 0.88 of the adult at 0.1 years against the 0.45 of the panel). The digitization reproduces the printed Adult_Max of both rows to within 0.02 (1.53 against 1.5 and 1.71 against 1.7), which is the check that the trace follows the published fit. Upreti 2016 predicted paediatric clearances within twofold in 100 % of their intravenous and 98 % of their oral cases with the in vivo functions against 51 % and 67 % with the in vitro ones, which is why the library uses them."

