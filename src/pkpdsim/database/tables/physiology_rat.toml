# The reference physiology of the adult male rat.
#
# The reference animal is the male rat of 250 g (the reference body weight of
# Arms and Travis 1988 discussed by Brown 1997: a male F344 rat of about 10
# weeks, a Sprague-Dawley or Wistar rat of 8-9 weeks). Organ weights, blood
# flows and the residual blood of the organs are those of the compilation of
# Brown 1997 (Tables 5, 21, 25, 30, read from the scanned tables); what Brown
# 1997 lacks is taken from the PK-Sim database (PKSimDB, Open Systems
# Pharmacology, develop aaebb648; the rat of Thiel 2015) and httk 2.7.4.
# Only the male: the organ weights, flows and residual blood of Brown 1997 are
# not given per sex; female data found are listed in the report (rodents.md).
#
# Conventions, as physiology_human.toml, with these differences:
# - Brown 1997 gives the weight of the excised organ with its residual blood
#   and the volume fraction of that blood (Table 30, organ volume basis). The
#   `mass` here is the tissue without blood, weight*(1 - phi); `blood` is
#   phi*weight/density over the total blood volume, so that `f_vas` equals phi.
# - `f_int` is Fint*(1 - f_vas) with Fint of the rat of httk 2.7.4 tissue.data
#   (reference Ruark 2014).
# - `flow` is the fraction of the cardiac output (Brown 1997 Table 25); the
#   portal organs split the portal vein flow by the shares of the PK-Sim
#   database (Brown 1997 has no single portal organ).
# - The arterial and venous pools hold the blood outside the organs, divided
#   25:75 (Brown 1997 p. 460); the portal vein is a model choice.
# - Proposed new keys (no human counterpart): `cardiac_output_exponent`,
#   `gfr_exponent` (the allometric exponent within the species) and
#   `urine_flow`. There is no `height` for the rat.
# - Adipose is the remainder of the body weight; its value is the reference.

[male]
bodyweight = { value = 0.25, unit = "kg", source = "Brown1997", notes = "reference adult male rat of 250 g (Arms and Travis 1988, discussed by Brown 1997 p. 414-415: a male F344 rat of 250 g is about 10 weeks old and still growing, terminal weights 450-475 g F344, above 500 g Sprague-Dawley); PK-Sim database rat: 0.2278 kg" }
body_surface_area = { value = 0.03901, unit = "m2", source = "Gouma2012", notes = "derived: Meeh formula BSA (cm2) = k*BW(g)^(2/3) with k = 9.83 (Gouma 2012, abstract: 30 Wistar rats of 195-240 g, planimetry), at 250 g" }
cardiac_output = { value = 0.08309, unit = "l/min", source = "Brown1997", notes = "derived: CO (l/min) = 0.235*BW(kg)^0.75 (Arms and Travis 1988, quoted by Brown 1997 p. 441, 83 ml/min for a 250 g rat) at 250 g; Brown 1997 Table 22: 110.4 +- 15.6 ml/min in unanesthetized rats (5 studies, 92 animals, weighted mean BW 396 g), 78.5 ml/min when scaled to 250 g with the exponent 0.75; httk/Davies 1993: 209.3 ml/min/kg^0.75 = 74.0 ml/min" }
cardiac_output_exponent = { value = 0.75, unit = "dimensionless", source = "Brown1997", notes = "allometric exponent of the cardiac output with body weight within the species, Arms and Travis 1988 (Brown 1997 p. 441, geometric mean of CO/BW^0.75 of unanesthetized rats)" }
hematocrit = { value = 0.46, unit = "dimensionless", source = "He2017", notes = "Table 2, median 46 % (reference interval 42-49 %) of 250 male Sprague-Dawley rats of about 9 weeks (299 g); female 42 % (40-46 %); httk/Davies 1993: 0.46" }
gfr = { value = 2.475, unit = "ml/min", source = "Carrara2016", notes = "derived: iohexol plasma clearance 0.99 +- 0.27 ml/min/100 g (reference GFR, conscious male Lewis rats; abstract) at 250 g; httk/Davies 1993: 3.705 ml/min/kg^0.75 = 1.31 ml/min, the same as the PK-Sim database (0.57 ml/min per ml kidney)" }
gfr_exponent = { value = 1.0, unit = "dimensionless", source = "Carrara2016", notes = "the GFR reported per 100 g body weight, i.e. proportional to body weight; Davies 1993 (httk) scale it with BW^0.75" }
hepatic_artery_fraction = { value = 0.1371, unit = "dimensionless", source = "Brown1997", notes = "derived: Table 25, hepatic artery 2.4 % of hepatic artery plus portal vein 2.4 + 15.1 % (Table 25 states a liver total of 17.4 %; Table 23: 2.1 of 18.3 %)" }
urine_flow = { value = 0.03472, unit = "ml/min", source = "Davies1993", notes = "derived: httk 2.7.4 physiology.data, urine 0.09821 ml/min/kg^0.75 (Davies and Morris 1993, not read) at 250 g, 50 ml/day" }

[male.blood]
volume = { value = 0.01577, unit = "l", source = "Lee1985", notes = "derived: BV (ml) = 0.06*BW (g) + 0.77 (Lee and Blaufox 1985, abstract: 70 awake Wistar rats of 100-400 g, red cell volume with Tc-99m plus plasma volume with I-125 albumin, r = 0.99; no significant difference of male and female) at 250 g, 15.77 ml = 63.1 ml/kg; Brown 1997 Table 21: blood 7.4 % BW; httk/Davies 1993: plasma 31.2 ml/kg" }
density = { value = 1.06, unit = "kg/l", source = "ICRP89", notes = "assumption: the specific gravity of human whole blood (ICRP 89 Section 7.2.1); no rodent value read" }
arterial = { value = 0.1072, unit = "dimensionless", source = "Brown1997", notes = "derived: a quarter of the blood outside the organs and the portal vein, 0.25*(1 - 0.5705 - portal); the 25:75 division of the blood between arterial and venous circulation of Leggett and Williams 1991 and Mapleson 1963 (Brown 1997 p. 460); no rodent measurement of the pools read" }
venous = { value = 0.3215, unit = "dimensionless", source = "Brown1997", notes = "derived: three quarters of the blood outside the organs and the portal vein, 25:75 division (Brown 1997 p. 460)" }
portal = { value = 0.000828, unit = "dimensionless", source = "ModelChoice", notes = "the fraction of the human male (Chau 2023 portal vein cylinder over ICRP 89 blood volume) carried over, the portal vein assumed to scale with the blood volume; no rodent portal vein volume read; the PK-Sim database has a portal vein of 1.5 ml (of 11.2 ml of the arterial, venous and portal blood of a 227.8 g rat), a compartment of the model rather than the vein" }

