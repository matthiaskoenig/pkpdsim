# The reference physiology of the domestic pig (growing, 30 kg), male and female.
#
# The reference animal is the domestic pig of the pharmacokinetic and
# hemodynamic studies (Landrace x Yorkshire or Large White crosses, growing,
# 30 kg, about 10 weeks). Its organ weights are the meta-analysis of Lin 2020
# (Tables 9 to 11, relative organ weights of swine of all ages, open access,
# with the extracted data of its Appendices S13 and S16), its flows the
# microsphere studies in unanesthetized pigs of 20 to 59 kg compiled there
# (Tables 17, 27, 28). The Goettingen minipig is not tabulated: its open data
# cover the organ weights of a few organs only (see pig.md).
#
# Conventions as physiology_human.toml, with these differences:
# - `mass` is the dissected organ weight of Lin 2020, which holds the residual
#   blood of the organ (a few percent, Lin 2020 Tables 31, 32), times the body
#   weight of the reference animal.
# - the densities and the vascular fractions `f_vas` of the organs are those
#   of the human (ICRP 89, physiology_human.toml; no in vivo data of the pig
#   found); `blood` follows from them with the masses and the blood volume of
#   the pig, the vascular pools are the remaining blood split as in the human.
# - Fint is the human Fint of Schmitt 2008 (httk has no pig).
# - the flows are percent of cardiac output of Lin 2020 Table 28 where measured,
#   muscle and adipose are perfusion times mass over cardiac output, bone and
#   gonads human perfusion times the mass of the pig (a choice).
# - no height: the pig has no height of the Huisinga scaling.
# Adipose is the remainder of the body weight in the physiology; its mass of
# Lin 2020 is a reference value.

[male]
bodyweight = { value = 30.0, unit = "kg", source = "ModelChoice", notes = "reference domestic pig (Landrace x Yorkshire or Large White crosses), growing, about 69 days (Lin 2020 Eq. 7, BW = 3.37 + 0.387 age in days, inverted); the conscious hemodynamic studies of Lin 2020 Table 17 and 28 had 20 to 58.7 kg, their mean weighted by animals about 30 kg (Lin 2020 Appendix S16); Upton 2008 uses 25 kg as the standard pig of biomedical research (as cited by Lin 2020)" }
body_surface_area = { value = 0.9781, unit = "m2", source = "Gasthuys2017", notes = "derived: Meeh formula k*BW^(2/3) with k = 0.1013 m2/kg^(2/3), the mean of k = BSA/BW^(2/3) of the four groups of Table 1 (BSA by CT for 2.01, 10.0, 13.9 kg; 2.42 m2 at 112.88 kg; Belgian Landrace x Large White, male)" }
cardiac_output = { value = 4.35, unit = "l/min", source = "Lin2020", notes = "derived: Table 17, 8.70 +- 1.62 l/h/kg (83 unanesthetized animals, 7 studies, 20-58.7 kg) times 30 kg; Hannon 1989 (immature Yorkshire x Duroc, 21.3 kg): 147 ml/min/kg (Lin 2020 Appendix S16, Table 9 of the report); no allometric exponent within the pig found, linear in body weight (a choice)" }
hematocrit = { value = 0.401, unit = "dimensionless", source = "Lin2020", notes = "Table 37, growing swine 40.1 +- 6.4 % (65.6 kg, 113 animals, 2 studies); young swine 39.9 +- 5.4 % (17.6 kg), all ages 41.2 +- 5.0 % (Table 36, 56.3 kg, 684 animals, 10 studies)" }
gfr = { value = 129.3, unit = "ml/min", source = "Gasthuys2017", notes = "derived: Table 2, exo-iohexol plasma clearance 4.31 +- 0.70 ml/min/kg at 7 weeks (13.9 kg, 16 male Belgian Landrace x Large White piglets) times 30 kg; within the growing pig the GFR scales with BW^1.092 at a given plasma creatinine (Table 3, model I, eGFR = 1.879 BW^1.092 / Pcr^0.600)" }
hepatic_artery_fraction = { value = 0.1401, unit = "dimensionless", source = "Lin2020", notes = "derived: Table 28, hepatic artery 4.4 % of the liver total 31.4 % (hepatic artery + stomach, small and large intestine, spleen and pancreas); with the measured portal vein flow (19.9 %) 4.4/(4.4 + 19.9) = 0.181" }

