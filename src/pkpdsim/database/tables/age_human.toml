[fat_free_mass.male]
form = "hill"
variable = "age"
x50 = 13.4
n = 12.7
base = 0.88
top = 1.0
source = "AlSallami2015"
sources = ["Fomon1982"]
notes = "the multiplier of the Janmahasatian 2005 fat-free mass of boys, 0.88 + (1 - 0.88)/(1 + (AGE/13.4)^-12.7); model M2 of Al-Sallami 2015 Table 4, read from the paper: a = 0.88 (bootstrap 95 % CI 0.87-0.89), the sigmoidicity c = 12.7 (13.0, 5.2-19.0) and the maturation half time A50 = 13.4 years (13.4, 12.7-13.8), with the upper bound b fixed to 1 so that the asymptote is the adult model. The index dataset is 853 dual energy X-ray absorptiometry measurements of 515 males of a median age of 13.8 years (range 3-29.7) and a median body mass index of 19.9 kg/m2 (13.6-36.2), the external test dataset 86 males. Relative to 20 years, 1 from 20 years; extrapolated below 3 years. Against the reference children of Fomon 1982 Table I (chemical analysis and balance data) the chain of Janmahasatian 2005 and this factor gives 0.97 to 0.92 of their fat-free mass over 3 to 10 years, so it under-predicts the fat-free mass of a child by 3 to 8 % and puts its body fat at 18 to 20 % against their 13 to 18 %."

[fat_free_mass.female]
form = "hill"
variable = "age"
x50 = 7.1
n = 1.1
base = 1.11
top = 1.0
source = "AlSallami2015"
sources = ["Fomon1982"]
notes = "the multiplier of the Janmahasatian 2005 fat-free mass of girls, 1.11 + (1 - 1.11)/(1 + (AGE/7.1)^-1.1); model M2 of Al-Sallami 2015 Table 4, read from the paper: a = 1.11 (bootstrap 95 % CI 1.09-1.16), c = 1.1 (1.1, 0.7-1.6) and A50 = 7.1 years (7.0, 3.5-10.3), with b fixed to 1. The index dataset is 926 dual energy X-ray absorptiometry measurements of 496 females of a median age of 11.6 years (range 3-29.3) and a median body mass index of 19.1 kg/m2 (12.6-41.3), the external test dataset 90 females; the factor is above 1 because the adult equation under-predicts the fat-free mass of girls. Relative to 20 years, 1 from 20 years; extrapolated below 3 years. Against the reference children of Fomon 1982 Table I the chain gives 0.94 to 0.91 of their fat-free mass over 3 to 10 years, so it puts the body fat of a girl at 23 to 27 % against their 16 to 19 %."

