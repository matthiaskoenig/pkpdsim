[liver_flow.aging]
form = "points"
age = [50.0, 100.0]
value = [1.0, 0.725]
source = "Zoli1999"
notes = "the fraction of the cardiac output to the liver (hepatic artery and portal organs) follows the liver volume (liver_mass), so the hepatic blood flow is the cardiac output times the liver volume factor, 0.72 at 80 years; a model choice of the form after Imamura 2026. Zoli 1999 Table 1 (40 healthy subjects within 10 % of the ideal body weight, 10 per group, echo-Doppler of the portal vein and the common hepatic artery, functional flow by the hepatic clearance of D-sorbitol) measures, for the age groups below 45, 45-60, 61-75 and above 75 years: portal flow 1209 +- 205, 980 +- 337, 978 +- 194 and 749 +- 117 ml/min (ANOVA p = 0.0018), hepatic artery flow 235 +- 76, 313 +- 117, 318 +- 144 and 271 +- 94 ml/min (p = 0.3632, not significant), total hepatic flow 1445 +- 220, 1293 +- 340, 1297 +- 253 and 1020 +- 148 ml/min (p = 0.0088) and functional hepatic flow 1514 +- 250, 1326 +- 348, 1258 +- 226 and 1015 +- 163 ml/min (p = 0.0023). The total flow above 75 years is 1020/1445 = 0.706 of the flow below 45 years and the functional flow 1015/1514 = 0.670; the two are correlated over the whole population (r = 0.871), so the fall is a fall of the flow and not an intrahepatic shunt. The decline is in the portal limb: the hepatic artery flow does not change significantly (a mild rise between 45 and 75 years), while the library applies one factor to the hepatic artery and the portal organs together, which is a known simplification. The library's factor is also shallower than these data at the oldest ages (0.835 at 80 years against the 0.706 of the group above 75 years), because its form follows the liver volume of Imamura 2026 and is anchored at 50 years"

[hematocrit.newborn]
form = "points"
age = [0.0, 0.019165, 0.038330, 0.076660, 0.16667]
value = [0.522, 0.460, 0.416, 0.385, 0.35]
source = "Scholkmann2019"
sources = ["Jopling2009"]
notes = "the hematocrit (fraction) of a newborn at term: days 0, 7, 14 and 28 of Scholkmann 2019, Equation 2 evaluated as printed at a gestational age of 40 weeks (the fit of about 100 000 neonates of Henry and Christensen 2015); the nadir 0.35 at 2 months of the PK-Sim database (secondary, the source of the value not read); from 1 year the table of NHANES. Jopling 2009 (Intermountain Healthcare, 41 957 hematocrit and 39 559 hemoglobin values of the first 28 days, every patient who received an erythrocyte transfusion excluded) confirms two things read before from its abstract only: there is no effect of sex on the hematocrit or the hemoglobin of the neonate, which the authors state they can now conclude confidently from this sample size, and the fall over the first 28 days, their term group (35-42 weeks) going from a mean hemoglobin of 18 g/dl (5th percentile 14) at birth to 13 g/dl (5th percentile 9.5) at 28 days, a ratio of 0.72 against the 0.385/0.522 = 0.74 of this curve. Their regression of the hematocrit on the gestational age within 6 hours of birth, 28.59 + 0.6359*GA in weeks (25 464 values), gives 54.0 % at 40 weeks against the 52.2 % here, and their reference range of the hematocrit at birth in term neonates is 42 to 65 %. Not modelled: the hematocrit of a late preterm or term neonate rises by 3.6 +- 0.5 % during the first four hours after delivery (placental transfusion), so day 0 is the value within hours of birth"

