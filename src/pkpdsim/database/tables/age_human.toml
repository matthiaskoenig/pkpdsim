# The physiology over age beyond the reference anatomy of children_human.toml:
# the maturation of the functions in the children and the aging of the adults.
#
# Every factor is relative: the physiology (`pkpdsim.pbpk.age`) divides a curve
# by its value at 35 years, the adult of ICRP 89, so the reference individual
# of ICRP 89 keeps its values. A factor acts at a fixed body weight and height,
# on top of the scaling of the physiology (Huisinga 2012).
#
# Forms (`form`):
# - `hill`: `base + (top - base) * x^n / (x50^n + x^n)`, `x` the postnatal age
#   in years (`variable = "age"`) or the postmenstrual age in weeks of a birth
#   at term (`variable = "pma"`, 40 weeks at birth), at least `x_min`;
# - `points`: values at ages (years), linear between them and constant beyond
#   the first and the last;
# - `log`: `a + b * ln(days)` of the postnatal age in days (at least one day).
# A table of values of another file (`table`) gives the factor of the ratio of
# its values to the value at 35 years.

[gfr.maturation]
form = "hill"
variable = "pma"
x50 = 47.7
n = 3.40
source = "Rhodin2009"
notes = "Table 2, the theoretical allometric model using normal fat mass (923 GFR measurements of 923 subjects from 22 weeks of postmenstrual age to 31 years, inulin, 51Cr-EDTA, 99mTc-DTPA and iohexol): half of the adult GFR at 47.7 weeks of postmenstrual age (95 % CI 45.1-50.5), Hill coefficient 3.40 (3.03-3.80), adult GFR 121 ml/min (117-125). At term (40 weeks of postmenstrual age) the function is 0.354, which is the 35 % of the asymptotic adult value the paper states, and at 1 year of postnatal age the predicted GFR is 90 % of the adult. Sex was not associated with any systematic difference, postnatal age added nothing over postmenstrual age, and the fat-free mass described the size better than the total body weight. The size term of this column is (WT/70)^0.75 while the library scales the GFR with the body surface area; Table 2 also gives the parameters estimated with a body surface area size model, TM50 52.7 weeks (48.9-56.6), Hill 3.30 (2.92-3.78) and an adult GFR of 101 ml/min (97-104), which would be the self-consistent pairing for the library and would make a term newborn 0.287 instead of 0.354 of the adult. The library keeps the normal fat mass column, which is the parameterisation of the paper and of every model derived from it, because Rhodin 2009 judge the body surface area scaling clearly worse and compute the body surface area by the Boyd formula from weight alone (their equation on p. 69), not by the Du Bois formula of the library; the body surface area column is recorded here as the alternative and is not used"

