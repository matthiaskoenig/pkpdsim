# The reference children of ICRP 89: newborn, 1, 5, 10 and 15 years, male and female.
#
# The values are those of ICRP Publication 89 (Valentin 2002) at the ages of
# `ages` (years, the newborn at 0), taken directly from its tables; the adult
# values are those of physiology_human.toml. The physiology interpolates them
# linearly in age up to the adult (`pkpdsim.pbpk.age`).
#
# Conventions: as physiology_human.toml, `organs.<o>` is the mass of the organ
# tissue without its blood (kg), the organs of the model by their token; the
# large intestine is the sum of the walls of right colon, left colon and
# rectosigmoid, the bone the total skeleton, the gonads the testes (male) or
# the ovaries (female). ICRP 89 tabulates the children of both sexes alike up
# to 10 years but the brain (5 and 10 years) and the gonads; the adipose mass
# is a reference value only (adipose is the remainder of the body weight in
# the model), as for the adults.

ages = [0.0, 1.0, 5.0, 10.0, 15.0]

[male]
bodyweight = { value = [3.5, 10.0, 19.0, 32.0, 56.0], unit = "kg", source = "ICRP89", notes = "Table 2.9, mass, male" }
height = { value = [51.0, 76.0, 109.0, 138.0, 167.0], unit = "cm", source = "ICRP89", notes = "Table 2.9, height, male" }
body_surface_area = { value = [0.24, 0.48, 0.78, 1.12, 1.62], unit = "m2", source = "ICRP89", notes = "Table 2.9 (and Table 2.26), surface area, male" }
blood_volume = { value = [0.27, 0.5, 1.4, 2.4, 4.5], unit = "l", source = "ICRP89", notes = "Section 7.4, total blood volume, males" }
cardiac_output = { value = [0.6, 1.2, 3.4, 5.0, 6.1], unit = "l/min", source = "ICRP89", notes = "Table 2.39 (Section 7.5), cardiac output, male" }

