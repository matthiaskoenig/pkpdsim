# The reference physiology of the adult male mouse.
#
# The reference animal is the male mouse of 25 g (the reference body weight
# of Arms and Travis 1988 discussed by Brown 1997: a male B6C3F1 mouse of about
# 9 weeks; adult mice reach 35-40 g). Organ weights, blood flows and the
# residual blood of the organs are those of the compilation of Brown 1997
# (Tables 4, 21, 22, 24, 30, read from the scanned tables); what Brown 1997
# lacks is taken from the PK-Sim database (PKSimDB, Open Systems Pharmacology,
# develop aaebb648; the mouse of Thiel 2015), httk 2.7.4 (Davies and Morris
# 1993) and the rat (tissue composition and densities).
# Only the male: the organ weights, flows and residual blood of Brown 1997 are
# not given per sex; female data found are listed in the report (rodents.md).
#
# Conventions, as physiology_human.toml, with these differences:
# - Brown 1997 gives the weight of the excised organ with its residual blood
#   and the volume fraction of that blood (Table 30, organ volume basis). The
#   `mass` here is the tissue without blood, weight*(1 - phi); `blood` is
#   phi*weight/density over the total blood volume, so that `f_vas` equals phi.
# - `f_int` is Fint*(1 - f_vas) with Fint of the rat (httk has no mouse) of httk 2.7.4 tissue.data
#   (reference Ruark 2014).
# - `flow` is the fraction of the cardiac output (Brown 1997 Table 24, which lacks adipose, bone
#   and the adrenals; the remainder of the flows, 'other_tissues', is large); the
#   portal organs split the portal vein flow by the shares of the PK-Sim
#   database (Brown 1997 has no single portal organ).
# - The arterial and venous pools hold the blood outside the organs, divided
#   25:75 (Brown 1997 p. 460); the portal vein is a model choice.
# - Proposed new keys (no human counterpart): `cardiac_output_exponent`,
#   `gfr_exponent` (the allometric exponent within the species) and
#   `urine_flow`. There is no `height` for the mouse.
# - Adipose is the remainder of the body weight; its value is the reference.

[male]
bodyweight = { value = 0.025, unit = "kg", source = "Brown1997", notes = "reference adult male mouse of 25 g (Arms and Travis 1988, discussed by Brown 1997 p. 413: a male B6C3F1 mouse of 25 g is about 9 weeks old; adult B6C3F1 mice reach 35-40 g); PK-Sim database mouse: 0.0210 kg" }
body_surface_area = { value = 0.008396, unit = "m2", source = "Cheung2009", notes = "derived: Meeh formula BSA (cm2) = k*BW(g)^(2/3) with k = 9.82 of C57BL/6J mice (Cheung 2009, abstract: pelts scanned, not different from other inbred and outbred strains of normal body composition), at 25 g" }
cardiac_output = { value = 0.01398, unit = "l/min", source = "Brown1997", notes = "Table 22, 13.98 +- 2.85 ml/min (12-16) in unanesthetized male C3H mice (Barbee 1992, Wang 1993b, microspheres, 16 animals; body weight not stated in Brown 1997); the flows of Table 24 are fractions of the same studies; Arms and Travis 1988: 0.275*BW^0.75 = 17.3 ml/min at 25 g; httk/Davies 1993: 150.4 ml/min/kg^0.75 = 9.46 ml/min" }
cardiac_output_exponent = { value = 0.75, unit = "dimensionless", source = "Brown1997", notes = "allometric exponent of the cardiac output with body weight within the species assumed by Arms and Travis 1988 (Brown 1997 p. 440); no intraspecies fit of the mouse read" }
hematocrit = { value = 0.45, unit = "dimensionless", source = "Davies1993", notes = "httk 2.7.4 physiology.data, mouse hematocrit 0.45 (Davies and Morris 1993, not read); the PK-Sim database mouse 0.45 (value origin Davies 1993); Riches 1973 (abstract): the venous hematocrit of the mouse differs markedly from the whole-body hematocrit" }
gfr = { value = 0.2367, unit = "ml/min", source = "Qi2004", notes = "FITC-inulin plasma clearance after a bolus, two-compartment model, 236.69 +- 16.55 ul/min in conscious male C57BL/6J mice (abstract; female 140.20 +- 22.27; urinary clearance 211.11 and 157.36 ul/min); body weight not in the abstract; httk/Davies 1993: 5.265 ml/min/kg^0.75 = 0.331 ml/min; PK-Sim database 0.824 ml/min per ml kidney" }
gfr_exponent = { value = 0.75, unit = "dimensionless", source = "Davies1993", notes = "assumption: the allometric scaling of httk (Davies and Morris 1993, ml/min/kg^0.75); no intraspecies fit of the mouse read" }
hepatic_artery_fraction = { value = 0.1242, unit = "dimensionless", source = "Brown1997", notes = "derived: Table 24, hepatic artery 2.0 % of hepatic artery plus portal vein 2.0 + 14.1 % (Table 24 states a liver total of 16.2 %)" }
urine_flow = { value = 0.0008211, unit = "ml/min", source = "Davies1993", notes = "derived: httk 2.7.4 physiology.data, urine 0.01306 ml/min/kg^0.75 (Davies and Morris 1993, not read) at 25 g, 1.2 ml/day" }

[male.blood]
volume = { value = 0.002118, unit = "l", source = "Riches1973", notes = "Riches 1973 (abstract): 84.7 +- 1.2 ml/kg of male CBA mice (59Fe red cells plus 131I albumin plasma volume; female CBA 96.3 +- 2.7, female CSI 95.0 +- 1.5 ml/kg) times 25 g; Brown 1997 Table 21: blood 4.9 % BW" }
density = { value = 1.06, unit = "kg/l", source = "ICRP89", notes = "assumption: the specific gravity of human whole blood (ICRP 89 Section 7.2.1); no rodent value read" }
arterial = { value = 0.08019, unit = "dimensionless", source = "Brown1997", notes = "derived: a quarter of the blood outside the organs and the portal vein, 0.25*(1 - 0.6784 - portal); the 25:75 division of the blood between arterial and venous circulation of Leggett and Williams 1991 and Mapleson 1963 (Brown 1997 p. 460); no rodent measurement of the pools read" }
venous = { value = 0.2406, unit = "dimensionless", source = "Brown1997", notes = "derived: three quarters of the blood outside the organs and the portal vein, 25:75 division (Brown 1997 p. 460)" }
portal = { value = 0.000828, unit = "dimensionless", source = "ModelChoice", notes = "the fraction of the human male (Chau 2023 portal vein cylinder over ICRP 89 blood volume) carried over, the portal vein assumed to scale with the blood volume; no rodent portal vein volume read; the PK-Sim database has a portal vein of 0.15 ml (of 0.90 ml of the arterial, venous and portal blood of a 21.0 g mouse), a compartment of the model rather than the vein" }

