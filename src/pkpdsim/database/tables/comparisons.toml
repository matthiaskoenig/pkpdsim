# Published parameterizations of the impairments, for comparison with the
# factors of the library (`docs/pbpk/impairment.md`); no factor of the
# library is read from this table. A value is the printed control and the
# classes in order, `[control, A, B, C]`.
#
# [johnson2010]: Johnson 2010 (Clin Pharmacokinet 49:189, Table III, the
# publication read), the parameters of the cirrhosis populations of the Simcyp
# Simulator from a meta-analysis of the literature; the CYP abundance per mg of
# microsomal protein of the functional liver (the liver volume fraction is the
# functional hepatocyte volume).

[johnson2010.child_pugh]
liver_volume = { value = [1.0, 0.81, 0.65, 0.53], unit = "dimensionless", source = "Johnson2010", library = "functional_liver", notes = "liver volume fraction (functional hepatocyte volume)" }
albumin = { value = [44.7, 41.1, 33.9, 26.3], unit = "g/L", source = "Johnson2010", library = "albumin", notes = "albumin" }
agp = { value = [0.80, 0.57, 0.52, 0.46], unit = "g/L", source = "Johnson2010", library = "agp", notes = "alpha-1-acid glycoprotein" }
hematocrit = { value = [40.9, 36.6, 32.9, 31.9], unit = "%", source = "Johnson2010", library = "hematocrit", notes = "haematocrit" }
cardiac_output = { value = [306.0, 355.0, 403.0, 431.0], unit = "L/h", source = "Johnson2010", library = "cardiac_index", notes = "cardiac output" }
