transit_time = { value = 15.3, unit = "min", source = "Davis2001", notes = "derived: small intestinal transit 3-4 h for solution, pellets and tablet (Davis 2001 via Henze 2019), its middle 210 min, by the length share 0.07285 (duodenum 2.2, jejunum 25.48, ileum 2.52 dm of the minipig of PK-Sim, OSP PK-Sim database; no segment lengths of the domestic pig read)" }
