# The intestine of the reference domestic pig (30 kg): the lumen
# segments of the segmented intestine, the mucosa, the single lumen and the bile.
#
# The segments are those of intestine_human.toml (Thelen 2011). The pig has a
# spiral colon without a sigmoid; its colon is split onto the five colonic
# segments in equal parts (a choice). The data of the pig are few and partly
# fed: pigs retain food in the stomach for many hours, a truly fasted pig is
# rare (Henze 2019). Fluid volumes are the water in the gut contents of fed
# pigs of 95-110 kg (Merchant 2011, Figure 4C) scaled to 30 kg by body weight,
# not free fluid as in the human table. No abundance of CYP3A (CYP3A29/46 in
# the pig) along the intestine was compiled: the key `cyp3a4` is left out.

[stomach]
volume = { value = 0.08107, unit = "l", source = "Merchant2011", notes = "derived: water of the stomach contents about 277 g (read from Figure 4C; fed ad libitum, 6 male pigs of 95-110 kg, 25 weeks) times 30/102.5 kg" }
transit_time = { value = 121.2, unit = "min", source = "Davis2001", notes = "derived: time to empty 50 % of a liquid 1.4 h (gamma scintigraphy, Landrace pigs after a light meal; Davis 2001 as cited by Henze 2019, not read) as mean residence time of a first order emptying, 1.4 h / ln 2; truly fasted pigs are rare" }
transit_time_fed = { value = 121.2, unit = "min", source = "ModelChoice", notes = "the value of transit_time (measured after a light meal); the gastric emptying of pigs after a meal is 1.5-6 h (Davis 2001, via Henze 2019), of Goettingen minipigs fasted or fed 4-6 h (Christiansen 2015, via Henze 2019)" }
ph = { value = 2.6, unit = "dimensionless", source = "ModelChoice", notes = "the middle of the fasted range 1.2-4.0 (Hossain 1990 as cited by Henze 2019 Table 1, not read); fed: fundus 4.6, antrum 4.4 (Merchant 2011 Figure 3C, mean of 6 pigs)" }
area_factor = { value = 0.0, unit = "dimensionless", source = "ModelChoice", notes = "no absorption in the stomach, as the human table" }

