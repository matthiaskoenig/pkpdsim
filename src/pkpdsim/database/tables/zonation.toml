lumen = { value = 0.106, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the sinusoidal lumen (plasma and erythrocytes) as a fraction of the liver parenchyma, rat liver, Blouin, Bolender and Weibel 1977" }
disse = { value = 0.049, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the space of Disse as a fraction of the liver parenchyma, rat liver" }
hepatocyte = { value = 0.780, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the hepatocytes as a fraction of the liver parenchyma, rat liver" }
endothelium = { value = 0.028, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the sinusoidal endothelial cells as a fraction of the liver parenchyma, rat liver" }
kupffer = { value = 0.021, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the Kupffer cells as a fraction of the liver parenchyma, rat liver; not assigned to a layer of the engine" }
stellate = { value = 0.014, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the stellate (Ito) cells as a fraction of the liver parenchyma, rat liver; not assigned to a layer of the engine" }
bile = { value = 0.004, unit = "dimensionless", source = "Blouin1977", notes = "fallback: rat; the bile canaliculi as a fraction of the liver parenchyma, rat liver" }
r_sin = { value = 4.4e-6, unit = "m", source = "ModelChoice", notes = "fallback: rat; the sinusoid radius, taken over from the predecessor zonated builder which this engine replaces" }
L_sin = { value = 300e-6, unit = "m", source = "ModelChoice", notes = "fallback: rat; the sinusoid length, taken over from the predecessor zonated builder which this engine replaces" }
t_endo = { value = 0.165e-6, unit = "m", source = "ModelChoice", notes = "fallback: rat; the thickness of the endothelium, taken over from the spt cell model which this engine replaces" }
t_disse = { value = 1.0e-6, unit = "m", source = "ModelChoice", notes = "fallback: rat; the width of the space of Disse, taken over from the predecessor zonated builder which this engine replaces" }
r_fen = { value = 53.5e-9, unit = "m", source = "ModelChoice", notes = "fallback: rat; the radius of a fenestra, taken over from the spt cell model which this engine replaces" }
n_fen = { value = 10e12, unit = "1/m**2", source = "ModelChoice", notes = "fallback: rat; the number of fenestrae per endothelial area, taken over from the spt cell model which this engine replaces" }
porosity_pp = { value = 0.06, unit = "dimensionless", source = "Braet2002", notes = "fallback: rat; the fenestral porosity of the endothelium at the periportal end, 6 % (rising to 8 % pericentral), Braet and Wisse 2002" }
porosity_pc = { value = 0.08, unit = "dimensionless", source = "Braet2002", notes = "fallback: rat; the fenestral porosity of the endothelium at the pericentral end, 8 % (6 % periportal), Braet and Wisse 2002" }
density = { value = 1.0, unit = "kg/l", source = "ModelChoice", notes = "the density of the liver tissue: ICRP 89 gives no specific gravity for the liver, and the convention of physiology_human.toml is that an organ without one has the density 1.0 kg/l; the human convention, not a rat fallback" }
f_par = { value = 1.0, unit = "dimensionless", source = "ModelChoice", notes = "fallback: rat; the fraction of the liver mass which is parenchyma and carries the sinusoids" }
haematocrit = { value = 0.43, unit = "dimensionless", source = "ICRP89", notes = "the share of the lumen which is erythrocytes: the male human reference of physiology_human.toml (hematocrit), red blood cells about 43 % of the blood volume of adult males, ICRP 89 Section 7.3 para 309, Table 2.12 2300 ml of 5300 ml. It is the one haematocrit this table holds: `ZonationSettings` has no sex, so a female build splits the lumen with this value as well (the female reference of ICRP 89 is 0.385, 1500 ml of 3900 ml), and a caller which wants another one passes it (`fractions(species, haematocrit=...)`). As for the rat, the haematocrit of the sinusoidal lumen is lower than the systemic one because of plasma skimming, which the engine does not model" }
bile_flow = { value = 0.27, unit = "ml/min", source = "Boyer1974", notes = "the canalicular bile flow of the human liver (reference male liver 1.8 kg, physiology_human.toml): 0.27 +- 0.16 ml/min, 44 to 95 % of the total bile secretion of 0.43 +- 0.12 ml/min (about 620 ml/day), measured by Boyer and Bloomer 1974 (J Clin Invest 54:773, the biliary clearance of [14C]mannitol; values from the abstract, the paper not read in full). The engine models the canaliculus and nothing downstream of it, the duct is a collector without epithelium, so it takes the canalicular fraction: the rest of the total is ductular secretion, which happens in a structure the engine does not have and would add water to the canaliculi which is added further down in the liver; 0.15 ul/min per g of liver. A human measurement and not the rat scaled: the rat secretes about 14 times more bile per g of liver (2.16 ul/min/g, liver_rat; an upper bound on the species difference, since the rat value includes a ductular contribution this value excludes: against the human total of 0.43 ml/min, 0.24 ul/min/g, the ratio is about 9), so the rat flow on a 1.8 kg liver would give about 5.6 l/day against 0.39 l/day canalicular and 0.62 l/day total" }
