# The geometry and the volume fractions of the zonated liver of `pkpdsim.zonation`.
#
# Units: lengths m, areas m**2, densities kg/l, fractions dimensionless. The rat
# fractions are the stereology of Blouin, Bolender and Weibel 1977, which reports
# them as fractions of the liver parenchyma, and that is what the engine
# computes with: a layer volume is its fraction of `f_par * mass / density`. The
# human liver carries the rat numbers (`fallback: rat`) until a sourced human
# stereology is entered.


[liver_rat]
lumen = { value = 0.106, unit = "dimensionless", source = "Blouin1977", notes = "the sinusoidal lumen (plasma and erythrocytes) as a fraction of the liver parenchyma, rat liver, Blouin, Bolender and Weibel 1977" }
disse = { value = 0.049, unit = "dimensionless", source = "Blouin1977", notes = "the space of Disse as a fraction of the liver parenchyma, rat liver" }
hepatocyte = { value = 0.780, unit = "dimensionless", source = "Blouin1977", notes = "the hepatocytes as a fraction of the liver parenchyma, rat liver" }
endothelium = { value = 0.028, unit = "dimensionless", source = "Blouin1977", notes = "the sinusoidal endothelial cells as a fraction of the liver parenchyma, rat liver" }
kupffer = { value = 0.021, unit = "dimensionless", source = "Blouin1977", notes = "the Kupffer cells as a fraction of the liver parenchyma, rat liver; not assigned to a layer of the engine" }
stellate = { value = 0.014, unit = "dimensionless", source = "Blouin1977", notes = "the stellate (Ito) cells as a fraction of the liver parenchyma, rat liver; not assigned to a layer of the engine" }
bile = { value = 0.004, unit = "dimensionless", source = "Blouin1977", notes = "the bile canaliculi as a fraction of the liver parenchyma, rat liver" }
r_sin = { value = 4.4e-6, unit = "m", source = "ModelChoice", notes = "the sinusoid radius, taken over from the predecessor zonated builder which this engine replaces" }
L_sin = { value = 300e-6, unit = "m", source = "ModelChoice", notes = "the sinusoid length, taken over from the predecessor zonated builder which this engine replaces" }
t_endo = { value = 0.165e-6, unit = "m", source = "ModelChoice", notes = "the thickness of the endothelium, taken over from the spt cell model which this engine replaces" }
t_disse = { value = 1.0e-6, unit = "m", source = "ModelChoice", notes = "the width of the space of Disse, taken over from the predecessor zonated builder which this engine replaces" }
r_fen = { value = 53.5e-9, unit = "m", source = "ModelChoice", notes = "the radius of a fenestra, taken over from the spt cell model which this engine replaces" }
n_fen = { value = 10e12, unit = "1/m**2", source = "ModelChoice", notes = "the number of fenestrae per endothelial area, taken over from the spt cell model which this engine replaces" }
porosity_pp = { value = 0.06, unit = "dimensionless", source = "Braet2002", notes = "the fenestral porosity of the endothelium at the periportal end, 6 % (rising to 8 % pericentral), Braet and Wisse 2002" }
porosity_pc = { value = 0.08, unit = "dimensionless", source = "Braet2002", notes = "the fenestral porosity of the endothelium at the pericentral end, 8 % (6 % periportal), Braet and Wisse 2002" }
density = { value = 1.05, unit = "kg/l", source = "httk", notes = "the density of the rat liver tissue, the value of physiology_rat.toml ([male.organs.li] density), so a standalone zonated rat liver and the same liver in the PBPK library have one parenchymal volume; the machine perfusion circuit takes 1.0 kg/l for the excised liver as a model choice (perfusion.toml [liver_rat] density, with the bile per g of liver of its study), and the perfusion adapter passes that density to the engine instead of this one" }
f_par = { value = 1.0, unit = "dimensionless", source = "ModelChoice", notes = "the fraction of the liver mass which is parenchyma and carries the sinusoids" }
haematocrit = { value = 0.46, unit = "dimensionless", source = "He2017", notes = "the share of the lumen which is erythrocytes: the systemic haematocrit of the rat, the value of physiology_rat.toml (hematocrit, Table 2, median 46 % of 250 male Sprague-Dawley rats). The haematocrit of the sinusoidal lumen is lower than the systemic one because of plasma skimming at the branchings which feed the sinusoids, and the engine models neither the skimming nor a haematocrit per zone, so the erythrocyte layer it gives a zone is an upper bound on the erythrocyte volume and its plasma layer a lower bound on the plasma volume. A caller which knows better passes its own (`fractions(species, haematocrit=...)`)" }
bile_flow = { value = 0.01562, unit = "ml/min", source = "Davies1993", notes = "the bile flow of the reference rat liver (7.229 g, physiology_rat.toml): 0.01562 ml/min (httk 2.7.4 physiology.data, 0.04419 ml/min/kg^0.75 of Davies and Morris 1993, not read, at 250 g), the number intestine_rat.toml derives its bile volume from, so the two agree; 2.16 ul/min per g of liver. It is bile collected from a duct cannula, a total which includes a small ductular contribution, used here as the canalicular flow because no canalicular-only rat value is at hand: an overestimate of the canalicular flow, in the direction of too much. A species value which is not scaled to the other species: the rat secretes about 14 times more bile per g of liver than the human canalicular flow (0.15 ul/min/g), an upper bound on the species difference because the rat value includes a ductular contribution the human value excludes; like for like with the human total of 0.43 ml/min over 1.8 kg (0.24 ul/min/g) the ratio is about 9, the figure of the species difference itself; a human fallback: rat would be wrong by about that factor" }

