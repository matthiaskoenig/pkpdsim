ph = { value = 6.01, unit = "dimensionless", source = "PKSimDB", notes = "PK-Sim database, fasted pH of the segment (no value origin; consistent with McConnell 2008, abstract: mean intestinal pH below 6.6 in the rat)" }
area_factor = { value = 1.0, unit = "dimensionless", source = "Yu1999", notes = "uniform absorption along the small intestine, as the human table" }
