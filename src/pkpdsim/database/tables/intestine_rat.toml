# The intestine of the adult male rat, in the segments
# of intestine_human.toml. Segment geometry (radii, lengths), fill levels,
# surface enhancement factors and the fasted pH are those of the PK-Sim
# database (develop aaebb648; no value origin is stored for them, the rat
# lengths cite Willmann 2003). The lumen volume of a segment is its frustum
# times the fractional steady state fill level of the database; the transit
# time of a region (literature) is split onto its segments by their volume
# shares (a uniform flow of the fluid). No values found: the fed gastric
# emptying, the intestinal Cyp3a of the rat; see rodents.md.

[stomach]
volume = { value = 0.001, unit = "l", source = "PKSimDB", notes = "derived: PK-Sim database stomach (radius 0.06 dm, length 0.27 dm, fractional steady state fill level 0.32748), pi*r^2*L*fill; McConnell 2008 (abstract): water content of the whole gastrointestinal tract of the fasted rat 3.2 +- 1.8 ml, the stomach capacity about 3.4 ml" }
transit_time = { value = 30.0, unit = "min", source = "PKSimDB", notes = "gastric emptying time 30 min of the PK-Sim database rat, fasted (no value origin); Grandoni 2019 Table 1: gastric MRT of the rat 2.7 to 60 min in the literature" }
# transit_time_fed: not found for the rat (no fed gastric emptying time read)
ph = { value = 3.9, unit = "dimensionless", source = "McConnell2008", notes = "abstract: rat stomach pH 3.9 fasted (3.2 fed); the PK-Sim database fasted basal pH 3.9" }
area_factor = { value = 0.0, unit = "dimensionless", source = "ModelChoice", notes = "no absorption in the stomach, as the human table" }

[duodenum]
volume = { value = 1.453e-05, unit = "l", source = "PKSimDB", notes = "derived: PK-Sim database lumen of the segment as a frustum (radii 0.0075 and 0.01 dm, length 1.0 dm) times its fractional steady state fill level 0.06" }
