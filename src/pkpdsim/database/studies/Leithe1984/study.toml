source = "Leithe1984"
tissue = "body"
control = "controls"
notes = "Normal subjects (12 men, 4 women, aged 51) and patients with congestive heart failure (54 men, 10 women, aged 54; idiopathic dilated cardiomyopathy 40, ischaemic 13, valvular 5, other 6) in three subgroups by the cardiac index: mild > 2.5, moderate 2.0-2.5 and severe < 2.0 L/min/m2 (n 18, 20, 26); the NYHA classes of the patients are II 12, III 28 and IV 24, the subgroups are no NYHA classes. Cardiac index by thermodilution (patients) and radioisotope dilution (normal subjects), hepatic blood flow by indocyanine green clearance and renal blood flow by PAH clearance, both from the plasma flow over one minus the hematocrit and per m2 of body surface area, limb (forearm) blood flow by venous occlusion plethysmography. The means and SD of the normal subjects are those of the Results text; the subgroups are digitized from the bars of Figure 1 (mean and SD; `scripts/database/leithe1984`, the image of page 3 of the PDF, every panel calibrated by its ticks; the lowest tick of the limb panel is labelled 0 at the spacing of 2 and is not used). The digitized subgroups give back the means of the whole heart failure group of the text, weighted by their n: cardiac index 2.18 (text 2.19 +- 0.47), hepatic 342 (340 +- 153), renal 392 (395 +- 131) and limb flow 4.48 (4.52 +- 1.77). The SD of the limb flow of the normal subjects in Figure 1 (4.3) is larger than in the text (3.16)."

[measurements.physiology]
file = "physiology.tsv"
kind = "physiology"
method = "thermodilution, indocyanine green and PAH clearance, plethysmography"
location = "Results and Figure 1, digitized"

[groups.controls]
condition = "control"
description = "normal subjects"

[groups.mild]
condition = "heart_failure"
nyha = "II"
description = "congestive heart failure with a cardiac index above 2.5 L/min/m2 (mild)"
assumption = "the subgroups of the cardiac index taken as the NYHA classes II, III and IV, as Rasool 2015 and Gu 2025 take them; the study grades the subgroups by the cardiac index, its patients are NYHA II to IV"

[groups.moderate]
condition = "heart_failure"
nyha = "III"
description = "congestive heart failure with a cardiac index of 2.0-2.5 L/min/m2 (moderate)"
assumption = "the subgroup of the cardiac index taken as NYHA III"

[groups.severe]
condition = "heart_failure"
nyha = "IV"
description = "congestive heart failure with a cardiac index below 2.0 L/min/m2 (severe)"
assumption = "the subgroup of the cardiac index taken as NYHA IV"
