source = "Drozdzik2021"
tissue = "liver"
control = "controls"
notes = "Livers of 77 patients undergoing liver transplantation for HCV (21), ALD (20), AIH (20), PBC (10) and PSC (6), classified by Child-Pugh (A 18, B 31, C 28), and 20 controls; the statistics of the supplementary Tables S2 and S3 as printed (median with range, mean with SD and CV, for the protein the samples above the limit of quantification over all samples, a sample below it counted as 0). The CYP2C19 and CYP2D6 groups leave out samples by their genotype (the n of the records). Extracted from the PDF of the supplementary material (Europe PMC, PMC8471929) by the positions of the words, every cell checked by its CV, its range and its counts; the cells of CYP1A1 on the first page of Table S2 and three cells of Table S3 transcribed by hand."

[measurements.protein]
file = "protein.tsv"
kind = "protein"
unit = "fmol/mg tissue"
method = "targeted proteomics, LC-MS/MS of the tissue homogenate"
location = "Table S3"

[measurements.mrna]
file = "mrna.tsv"
kind = "mrna"
unit = "relative to the mean of the controls (2^-ddCt)"
method = "qRT-PCR (TaqMan), normalized to the mean of five housekeeping genes"
location = "Table S2"

[groups.controls]
condition = "control"
description = "liver tissue of patients with colorectal cancer metastases, at least 5 cm from the tumour, without pathological signs in histology"

