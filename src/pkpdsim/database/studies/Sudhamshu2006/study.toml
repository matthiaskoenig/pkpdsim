notes = "Doppler hemodynamics of 100 cirrhotic patients and 60 controls without cirrhosis; the controls of Li 2015 are the 30 patients with a normal liver (NLP). The study measured the flow of the portal trunk and of the right portal vein (abstract); the portal flow which Li 2015 tabulate is that of the right portal vein, the flow of the trunk is not in the database. The hepatic arterial flow is calculated by Li 2015 from the diameter and velocity of the proper hepatic artery; the numbers as Li 2015 tabulate them for their meta-analysis (Supplementary Materials, Physiological and biological values used in meta-analysis, PMC4505828, CC BY-NC); the primary publication was not read."

