# The impaired organ function of the library (`pkpdsim.pbpk.impairment`): liver
# cirrhosis by the Child-Pugh class, chronic kidney disease (CKD) by the stage
# of the GFR and heart failure by the NYHA class. Every number is a factor on
# a quantity of the healthy individual (dimensionless, 1 healthy) unless the
# notes say otherwise.
#
# [child_pugh]: the classes A, B, C (`CP_severity` 1, 2, 3; 0 is healthy); a
# severity between the classes interpolates linearly. The physiological
# factors are those of Edginton & Willmann 2008; their primary paper was not
# accessible, the values are transcribed from Alasmari 2024 (Pharmaceutics
# 16:1540, Table 3, CC BY 4.0, doi:10.3390/pharmaceutics16121540), which cites
# Edginton 2008, and are marked unverified. The enzymes and transporters are
# the median abundances per g liver of El-Khateeb 2021 (Figures 1, 2 and 4,
# the percentages of change from the control which the figures annotate; open
# access, CC BY 4.0), the only source with all three classes; a class the
# figures do not annotate (no significant change, CP-A has n = 6) is the
# linear interpolation between healthy and the next annotated class, a model
# choice which the notes name. Johnson 2010 (Clin Pharmacokinet 49:189,
# doi:10.2165/11318160-000000000-00000), the abundance factors of the Simcyp
# cirrhosis populations, was not accessible and is not used. Prasad 2018 (Drug
# Metab Dispos 46:943, doi:10.1124/dmd.118.080523, Table 3) measured
# end-stage (assumed Child-Pugh C) alcoholic and HCV cirrhotic livers: the
# ratios to the control (alcoholic, HCV) CYP3A4 0.12, 0.23; CYP1A2 0.17, 0.22;
# CYP2E1 0.27, 0.41; CYP2C9 0.45, 0.42; CYP2C8 0.41, 0.46; CYP2A6 0.36, 0.31;
# CYP2D6 0.72, 0.64; UGT2B7 0.14, 0.16 agree with El-Khateeb 2021 for class C
# within the variability, but for CYP2D6, CYP2C8 and CYP2C9, which El-Khateeb
# 2021 find more reduced (they discuss it).
#
# The shunt and the portal blood flow (reconciliation): the shunt fractions
# are the degrees of cirrhosis of the König lab (`pkpdsim.impairment.CIRRHOSIS`,
# fitted to the indocyanine green clearance of the Child-Pugh classes, Köller
# 2021), which set the shunt of the portal venous blood and the loss of
# parenchyma together in the ICG model. Edginton 2008 represent the
# portosystemic shunting by a portal vein flow of 0.40, 0.36 and 0.04 of
# healthy. Both describe the same portal blood which does not reach the
# sinusoids; applied together they would count it twice. The library takes
# the shunt (`f_shunt`): the splanchnic flow of the portal organs is not
# reduced and the fraction `f_shunt` of the liver inflow bypasses the liver,
# so the portal blood which perfuses the liver is 0.60, 0.30 and 0.19 of
# healthy (Edginton 2008: 0.40, 0.36, 0.04). The library's shunt acts on the
# hepatic arterial inflow as well (the ICG model shunts the portal blood only),
# so the perfused arterial flow is (1 - f_shunt) times the increased hepatic
# arterial flow of Edginton 2008.
#
# [ckd]: the stages by the GFR per 1.73 m2 of the renal function
# (`f_renal_function` times the healthy GFR per 1.73 m2 of the reference
# individual): normal >= 90, mild 60-89, moderate 30-59, severe 15-29, end
# stage < 15 ml/min/1.73 m2; a list gives mild, moderate, severe and end stage,
# normal is 1. The physiology of Malik 2020 (paywalled) is unverified: the
# regressions of kidney volume and flow on the eGFR, the gastric emptying and
# small intestinal transit factors and the plasma protein factor are the values
# of the plan of the library (its research notes of the PK-Sim CKD population,
# which implements Malik 2020); the hematocrit is transcribed from Alasmari 2023
# (Front Pharmacol 14:1200828, Table 3, CC BY 4.0, doi:10.3389/fphar.2023.1200828).
# The hepatic proteins (switch `CKD_hepatic`) are the mean ratios of the unbound
# clearance of model drugs (Yoshida 2016, Tan 2018), clearances of the drugs,
# taken as activity of the pathway.
#
# [heart_failure]: the NYHA classes I to IV (`HF_severity` 1 to 4, 0 healthy).
# The flows of the organs are multiplied, the cardiac output is their sum
# (Gu 2025, Table 1: the lung flow of each class is the sum of the organ flows).

[child_pugh]
healthy_hematocrit = { value = 0.45, unit = "dimensionless", source = "ModelChoice", notes = "the healthy hematocrit to which the absolute hematocrit of the classes is related; Edginton 2008 and Alasmari 2023 state absolute values without their healthy reference here; 0.45 is within the healthy adult range of ICRP 89 (0.37-0.52 for women and men)" }
functional_liver = { value = [0.69, 0.55, 0.28], unit = "dimensionless", source = "Edginton2008", notes = "functional liver mass of the classes A, B, C relative to healthy, the functional fraction `f_functional`; unverified: transcribed from Alasmari 2024, Table 3, which cites Edginton 2008; the ICG model of Köller 2021 keeps 1 - f_cirrhosis = 0.60, 0.30, 0.19 of the parenchyma" }
shunt = { value = [0.3994897959183674, 0.6979591836734694, 0.8127551020408164], unit = "dimensionless", source = "Koller2021", notes = "portosystemic shunt `f_shunt` of the classes A, B, C (healthy 0), the degrees of cirrhosis of the Child-Pugh classes of `pkpdsim.impairment.CIRRHOSIS` (bit-identical here; the MathML of the SBML writes 15 significant digits), fitted to the ICG clearance of the classes with the ICG model of Köller 2021 (unverified: the values of pkpdsim.impairment, attributed to this work, not checked against the paper); replaces the reduced portal vein flow of Edginton 2008 (0.40, 0.36, 0.04), see the header" }
hepatic_artery_flow = { value = [1.3, 2.3, 3.4], unit = "dimensionless", source = "Edginton2008", notes = "hepatic arterial blood flow relative to healthy (hepatic arterial buffer response); unverified: transcribed from Alasmari 2024, Table 3" }
kidney_flow = { value = [0.88, 0.65, 0.48], unit = "dimensionless", source = "Edginton2008", notes = "renal blood flow relative to healthy; unverified: transcribed from Alasmari 2024, Table 3" }
cardiac_index = { value = [1.11, 1.27, 1.36], unit = "dimensionless", source = "Edginton2008", notes = "cardiac index relative to healthy (hyperdynamic circulation); the flows of the organs without a factor of their own (heart, muscle, skin, adipose, bone, gonads) close the cardiac output to it; Edginton 2008 give 1.75, 2.25 and 2.75 for the flow of the other organs (Alasmari 2024), which with the organ flows of the library would exceed the cardiac index and is not used; unverified: transcribed from Alasmari 2024, Table 3" }
gfr = { value = [1.0, 0.70, 0.36], unit = "dimensionless", source = "Edginton2008", notes = "glomerular filtration rate relative to healthy (hepatorenal reduction); unverified: transcribed from Alasmari 2024, Table 3" }
albumin = { value = [0.81, 0.68, 0.50], unit = "dimensionless", source = "Edginton2008", notes = "plasma albumin relative to healthy, the binding protein factor of fu; unverified: transcribed from Alasmari 2024, Table 3" }
agp = { value = [0.60, 0.56, 0.30], unit = "dimensionless", source = "Edginton2008", notes = "plasma alpha-1-acid glycoprotein relative to healthy, the binding protein factor of fu; unverified: transcribed from Alasmari 2024, Table 3" }
hematocrit = { value = [0.39, 0.37, 0.35], unit = "dimensionless", source = "Edginton2008", notes = "absolute hematocrit of the classes A, B, C, the factor relative to `healthy_hematocrit`; unverified: transcribed from Alasmari 2024, Table 3" }

