[ckd]
stage_gfr = { value = [90.0, 60.0, 30.0, 15.0], unit = "ml/min", source = "Yoshida2016", notes = "lower limits of the GFR per 1.73 m2 of normal function and of mild, moderate and severe CKD (Methods: mild 60-89, moderate 30-59, severe 15-29, end stage < 15 ml/min/1.73 m2, the classes of the FDA guidance)" }
plasma_protein_fu = { value = [1.0, 1.07, 1.16, 1.55], unit = "dimensionless", source = "Malik2020", notes = "factor on fu of mild, moderate (stage 3), severe (stage 4) and end stage (stage 5) CKD, the uraemic displacement and the lower albumin; unverified: the values of the plan of the library; Alasmari 2023 (Table 3) tabulate a plasma protein correction factor of 1.45, 2.20 and 2.50 for the stages 3 to 5 from Malik 2020, the primary paper decides" }
hematocrit = { value = [0.45, 0.44, 0.40, 0.34], unit = "dimensionless", source = "Malik2020", notes = "absolute hematocrit of mild (healthy, `healthy_hematocrit`), moderate, severe and end stage CKD, the factor relative to `healthy_hematocrit` (renal anaemia); unverified: transcribed from Alasmari 2023, Table 3, which cites Malik 2020" }
