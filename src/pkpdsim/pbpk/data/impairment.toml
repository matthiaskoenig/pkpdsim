# The impaired organ function of the library (`pkpdsim.pbpk.impairment`): liver
# cirrhosis by the Child-Pugh class, chronic kidney disease (CKD) by the stage
# of the GFR and heart failure by the NYHA class. Every number is a factor on
# a quantity of the healthy individual (dimensionless, 1 healthy) unless the
# notes say otherwise. A vector gives the classes in order; `choice` names the
# classes whose value is a choice of the library and not a value of `source`
# (the notes give the choice), the SBML notes cite ModelChoice for them.
#
# [child_pugh]: the classes A, B, C (`CP_severity` 1, 2, 3; 0 is healthy); a
# severity between the classes interpolates linearly. The physiological
# factors are those which Alasmari 2024 (Pharmaceutics 16:1540, Table 3, CC BY
# 4.0, doi:10.3390/pharmaceutics16121540, the publication read) attribute to
# Edginton & Willmann 2008 (doi:10.2165/00003088-200847110-00005, not read);
# they are model choices, not verified. The enzymes and transporters are the
# median abundances per g liver of El-Khateeb 2021 (Figures 1, 2 and 4, the
# percentages of change from the control which the figures annotate; open
# access, CC BY 4.0), the only source with all three classes; a class the
# figures do not annotate (no significant change, CP-A has n = 6) is the
# linear interpolation between healthy and the next annotated class, a model
# choice (`choice`). Johnson 2010 (Clin Pharmacokinet 49:189,
# doi:10.2165/11318160-000000000-00000), the abundance factors of the Simcyp
# cirrhosis populations, was not accessible and is not used. Prasad 2018 (Drug
# Metab Dispos 46:943, doi:10.1124/dmd.118.080523, Table 3) measured
# end-stage (assumed Child-Pugh C) alcoholic and HCV cirrhotic livers: the
# ratios to the control (alcoholic, HCV) CYP3A4 0.12, 0.23; CYP1A2 0.17, 0.22;
# CYP2E1 0.27, 0.41; CYP2C9 0.45, 0.42; CYP2C8 0.41, 0.46; CYP2A6 0.36, 0.31;
# CYP2D6 0.72, 0.64; UGT2B7 0.14, 0.16 agree with El-Khateeb 2021 for class C
# within the variability, but for CYP2D6, CYP2C8 and CYP2C9, which El-Khateeb
# 2021 find more reduced (they discuss it).
#
# The shunt and the portal blood flow (reconciliation): the shunt fractions
# are the degrees of cirrhosis of the Child-Pugh classes of
# `pkpdsim.impairment.CIRRHOSIS`, which set the shunt of the portal venous
# blood and the loss of parenchyma together in the hand-written ICG models.
# Edginton 2008 (per Alasmari 2024) represent the portosystemic shunting by a
# portal vein flow of 0.40, 0.36 and 0.04 of healthy. Both describe the same
# portal blood which does not reach the sinusoids; applied together they
# would count it twice. The library takes the shunt (`f_shunt`): the
# splanchnic flow of the portal organs is not reduced and the fraction
# `f_shunt` of the liver inflow bypasses the liver, so the portal blood which
# perfuses the liver is 0.60, 0.30 and 0.19 of healthy (Edginton 2008: 0.40,
# 0.36, 0.04). The library's shunt acts on the hepatic arterial inflow as well
# (the ICG models shunt the portal blood only), so the perfused arterial flow
# is (1 - f_shunt) times the increased hepatic arterial flow.
#
# The hematocrit: cirrhosis and CKD reduce it (anaemia), and the two factors
# would combine multiplicatively on the hematocrit of the sex of the build
# (`HCT = HCT_ref*fimp_HCT`). The publications read state absolute hematocrits
# without the healthy value of their population, so no factor relative to the
# source's healthy value can be derived: both factors are 1 until a source
# with its healthy reference is read.
#
# [ckd]: the stages by the GFR per 1.73 m2 of the renal function
# (`f_renal_function` times the healthy GFR per 1.73 m2 of the reference
# individual): normal >= 90, mild 60-89, moderate (stage 3) 30-59, severe
# (stage 4) 15-29, end stage (stage 5) < 15 ml/min/1.73 m2; a vector gives
# mild, moderate, severe and end stage, normal is 1. The factors are steps at
# the stage limits: a scan or fit of `f_renal_function` across a limit sees a
# discontinuity. Malik 2020 (paywalled) was not read; the effects which PK-Sim
# takes from it and no open publication read gives with its healthy reference
# (kidney volume and blood flow, gastric emptying and small intestinal
# transit) are 1 with a note. The plasma protein factor is read in Alasmari
# 2023 (Front Pharmacol 14:1200828, Table 3, CC BY 4.0,
# doi:10.3389/fphar.2023.1200828), which tabulates it for the stages 3 to 5
# from Malik 2020. The hepatic proteins (switch `CKD_hepatic`) are the mean
# ratios of the unbound clearance of model drugs (Yoshida 2016, Tan 2018),
# clearances of the drugs, taken as activity of the pathway. The tubular
# capacity (`tubular_capacity`, a number, not a vector of the stages) is the
# share of the capacity of the processes of the kidney which follows the renal
# function continuously (the intact nephron hypothesis), a model choice.
#
# [heart_failure]: the NYHA classes I to IV (`HF_severity` 1 to 4, 0 healthy).
# The flows of the organs are multiplied, the cardiac output is their sum
# (Gu 2025, Table 1: the lung flow of each class is the sum of the organ flows).
# The renal blood flow is not monotonic in the class (NYHA IV 0.629 above
# NYHA III 0.55, as measured by Leithe 1984), and the GFR follows it.

[child_pugh]
functional_liver = { value = [0.69, 0.55, 0.28], unit = "dimensionless", source = "ModelChoice", notes = "functional liver mass of the classes A, B, C relative to healthy, the functional fraction `f_functional`: the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (doi:10.3390/pharmaceutics16121540, the publication read); not verified; the ICG models keep 1 - f_cirrhosis = 0.60, 0.30, 0.19 of the parenchyma" }
shunt = { value = [0.3994897959183674, 0.6979591836734694, 0.8127551020408164], unit = "dimensionless", source = "ModelChoice", notes = "portosystemic shunt `f_shunt` of the classes A, B, C (healthy 0): the values of pkpdsim.impairment.CIRRHOSIS (bit-identical here; the MathML of the SBML writes 15 significant digits), the degrees of cirrhosis of the Child-Pugh classes of the hand-written ICG models; their publication is not verified; replaces the reduced portal vein flow of Edginton 2008 (0.40, 0.36, 0.04), see the header" }
hepatic_artery_flow = { value = [1.3, 2.3, 3.4], unit = "dimensionless", source = "ModelChoice", notes = "hepatic arterial blood flow relative to healthy (hepatic arterial buffer response): the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified" }
kidney_flow = { value = [0.88, 0.65, 0.48], unit = "dimensionless", source = "ModelChoice", notes = "renal blood flow relative to healthy: the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified" }
cardiac_index = { value = [1.11, 1.27, 1.36], unit = "dimensionless", source = "ModelChoice", notes = "cardiac index relative to healthy (hyperdynamic circulation): the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified; the flows of the organs without a factor of their own (heart, muscle, skin, adipose, bone, gonads) close the cardiac output to it; Alasmari 2024 give 1.75, 2.25 and 2.75 for the flow of the other organs, which with the organ flows of the library would exceed the cardiac index and is not used" }
gfr = { value = [1.0, 0.70, 0.36], unit = "dimensionless", source = "ModelChoice", notes = "glomerular filtration rate relative to healthy (hepatorenal reduction): the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified" }
albumin = { value = [0.81, 0.68, 0.50], unit = "dimensionless", source = "ModelChoice", notes = "plasma albumin relative to healthy, the binding protein factor of fu: the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified" }
agp = { value = [0.60, 0.56, 0.30], unit = "dimensionless", source = "ModelChoice", notes = "plasma alpha-1-acid glycoprotein relative to healthy, the binding protein factor of fu: the values of Edginton & Willmann 2008 as tabulated in Alasmari 2024, Table 3 (the publication read); not verified" }
hematocrit = { value = [1.0, 1.0, 1.0], unit = "dimensionless", source = "ModelChoice", notes = "hematocrit relative to healthy: 1 until a source with its healthy value is read; Alasmari 2024 (Table 3, the publication read) tabulate absolute hematocrits of 0.39, 0.37 and 0.35 for the classes A, B, C (attributed to Edginton & Willmann 2008, not read) without the healthy hematocrit of the population, so no relative factor can be derived" }

