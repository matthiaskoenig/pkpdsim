hematocrit = { value = [1.0, 1.0, 1.0, 1.0], unit = "dimensionless", source = "ModelChoice", notes = "hematocrit relative to healthy: 1 until a source with its healthy value is read; Alasmari 2023 (Table 3, the publication read) tabulate absolute hematocrits of 0.44, 0.40 and 0.34 for the stages 3, 4 and 5 (from Malik 2020, not read) without the healthy hematocrit of the population, so no relative factor can be derived" }
