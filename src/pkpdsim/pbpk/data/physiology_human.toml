# The reference physiology of the adult human, male and female.
#
# The values are those of the reference individuals of ICRP Publication 89
# (Valentin 2002), taken directly from its tables; `notes` names the table or
# section of every value. Where ICRP 89 has no value, another primary source is
# cited. The male values are compared in `notes` with the supplementary model of
# Jones and Rowland-Yeo 2013 (a 70 kg man), which takes its values from other
# references (Brown 1997 and others).
#
# Conventions:
# - `mass` is the ICRP 89 mass of the organ without its blood: the whole-body
#   sum of ICRP 89 Table 2.8 counts the blood (5.6 kg male, 4.1 kg female) on
#   its own, so the organ masses (lung and heart explicitly) exclude it.
# - `density` is the specific gravity of the organ (kg/l) where ICRP 89 states
#   one; an organ without `density` has the density 1.0 kg/l.
# - `blood` is the blood content of the organ as fraction of the total blood
#   volume (ICRP 89 Table 2.14). The organ volume of the model is the volume of
#   the tissue and its blood, `mass/density + blood*V_blood`.
# - `f_vas` is the vascular fraction of that organ volume,
#   `blood*V_blood / (mass/density + blood*V_blood)` of the reference individual.
# - `f_int` is the interstitial fraction of that organ volume,
#   `Fint*(1 - f_vas)`, with `Fint` the interstitial fraction of the tissue
#   without blood of Schmitt 2008; the intracellular fraction is
#   `1 - f_vas - f_int`.
# - `flow` is the blood flow as fraction of cardiac output (ICRP 89 Table 2.40).
#   The lung is in series and receives the cardiac output (1.0); the liver
#   states its arterial flow, the portal organs (stomach, small and large
#   intestine, spleen, pancreas) feed it in addition.
# - Adipose is the remainder of the body weight in the physiology; its ICRP
#   mass is a reference value. The tissues of ICRP 89 which are not organs of
#   the model are listed in `[<sex>.unmapped]` with their mass, flow and blood:
#   the mass is what adipose absorbs, the flows and blood complete those of the
#   organs to one.

