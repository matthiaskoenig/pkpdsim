# The Mexican American adults of the United States, aged 20 to 49 years (age at
# examination), from the NHANES examinations 2013-2018 as preprocessed in
# the data set `mecdt` of httk 2.7.4 (HTTK-Pop, Ring 2017). The numbers are
# survey-weighted (6-year examination weights `wtmec6yr`) means and standard
# deviations of the respondents with body weight and height; the age band is
# a choice of the library (adults, the ages of most clinical studies).

name = "Mexican American (NHANES 2013-2018)"
source = "Ring2017"

[male.reference]
BW = { value = 89.40, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean body weight of the 550 Mexican American male respondents aged 20-49 y" }
HEIGHT = { value = 171.54, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean height (standing height or recumbent length) of the 550 Mexican American male respondents aged 20-49 y" }
AGE = { value = 33.47, unit = "yr", source = "NHANES2013_2018", notes = "survey-weighted mean age at examination of the 550 Mexican American male respondents aged 20-49 y" }

[male.covariates]
BW = { kind = "lognormal", mean = 89.40, sd = 20.37, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the body weight of the 550 Mexican American male respondents aged 20-49 y; lognormal, the body weight is skewed to the right" }
HEIGHT = { kind = "normal", mean = 171.54, sd = 7.17, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the height of the 550 Mexican American male respondents aged 20-49 y" }

[female.reference]
BW = { value = 78.76, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean body weight of the 668 Mexican American female respondents aged 20-49 y" }
HEIGHT = { value = 157.80, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean height (standing height or recumbent length) of the 668 Mexican American female respondents aged 20-49 y" }
AGE = { value = 33.95, unit = "yr", source = "NHANES2013_2018", notes = "survey-weighted mean age at examination of the 668 Mexican American female respondents aged 20-49 y" }

[female.covariates]
BW = { kind = "lognormal", mean = 78.76, sd = 21.27, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the body weight of the 668 Mexican American female respondents aged 20-49 y; lognormal, the body weight is skewed to the right" }
HEIGHT = { kind = "normal", mean = 157.80, sd = 6.51, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the height of the 668 Mexican American female respondents aged 20-49 y" }
