# The non-Hispanic black adults of the United States, aged 20 to 49 years (age at
# examination), from the NHANES examinations 2013-2018 as preprocessed in
# the data set `mecdt` of httk 2.7.4 (HTTK-Pop, Ring 2017). The numbers are
# survey-weighted (6-year examination weights `wtmec6yr`) means and standard
# deviations of the respondents with body weight and height; the age band is
# a choice of the library (adults, the ages of most clinical studies).

name = "Black American (NHANES 2013-2018)"
source = "Ring2017"

[male.reference]
BW = { value = 91.22, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean body weight of the 699 non-Hispanic black male respondents aged 20-49 y" }
HEIGHT = { value = 176.92, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean height (standing height or recumbent length) of the 699 non-Hispanic black male respondents aged 20-49 y" }
AGE = { value = 33.47, unit = "yr", source = "NHANES2013_2018", notes = "survey-weighted mean age at examination of the 699 non-Hispanic black male respondents aged 20-49 y" }

[male.covariates]
BW = { kind = "lognormal", mean = 91.22, sd = 25.11, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the body weight of the 699 non-Hispanic black male respondents aged 20-49 y; lognormal, the body weight is skewed to the right" }
HEIGHT = { kind = "normal", mean = 176.92, sd = 6.93, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the height of the 699 non-Hispanic black male respondents aged 20-49 y" }

[female.reference]
BW = { value = 86.20, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean body weight of the 855 non-Hispanic black female respondents aged 20-49 y" }
HEIGHT = { value = 163.50, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean height (standing height or recumbent length) of the 855 non-Hispanic black female respondents aged 20-49 y" }
AGE = { value = 34.05, unit = "yr", source = "NHANES2013_2018", notes = "survey-weighted mean age at examination of the 855 non-Hispanic black female respondents aged 20-49 y" }

[female.covariates]
BW = { kind = "lognormal", mean = 86.20, sd = 25.02, unit = "kg", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the body weight of the 855 non-Hispanic black female respondents aged 20-49 y; lognormal, the body weight is skewed to the right" }
HEIGHT = { kind = "normal", mean = 163.50, sd = 6.43, unit = "cm", source = "NHANES2013_2018", notes = "survey-weighted mean and standard deviation of the height of the 855 non-Hispanic black female respondents aged 20-49 y" }
