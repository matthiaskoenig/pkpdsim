[project]
site_name = "pkpdsim"
site_url = "https://matthiaskoenig.github.io/pkpdsim/"
site_description = "A library for physiologically based pharmacokinetic and pharmacodynamic (PBPK/PD) models in SBML: a standard physiology at its centre, the substances, chemistry, routes and observers of a model on top of it, and the simulation experiments, fits, scans, uncertainty and credibility of sbmlsim on top of those."
site_author = "Matthias König"

copyright = 'Copyright &copy; 2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/pkpdsim"
repo_name = "matthiaskoenig/pkpdsim"
edit_uri = "edit/develop/docs/"

# the diagrams of the PBPK library, see `docs/stylesheets/pbpk.css`
extra_css = ["stylesheets/pbpk.css"]
extra_javascript = ["javascripts/figures.js"]

